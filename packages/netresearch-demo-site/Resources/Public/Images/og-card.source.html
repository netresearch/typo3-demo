<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --nr-primary: #2F99A4;
    --nr-accent:  #FF4D00;
    --nr-text:    #585961;
    --nr-border:  #E3E5E6;
    --nr-bg:      #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--nr-bg);
    font-family: 'Open Sans', system-ui, sans-serif;
    color: var(--nr-text);
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 64px 72px 56px;
    position: relative;
    overflow: hidden;
  }
  /* Accent is a highlight, never a surface: one hairline rule, nothing more. */
  body::before {
    content: ""; position: absolute; left: 0; top: 0;
    width: 100%; height: 10px; background: var(--nr-primary);
  }
  /* A quiet teal wash so the card is not a white rectangle in a white feed. */
  body::after {
    content: ""; position: absolute; right: -180px; bottom: -260px;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(47,153,164,.10) 0%, rgba(47,153,164,0) 70%);
  }
  header { display: flex; align-items: center; gap: 20px; }
  header img { width: 56px; height: 56px; display: block; }
  header .wordmark {
    font-family: 'Raleway', sans-serif; font-weight: 600; font-size: 26px;
    color: var(--nr-text); letter-spacing: .01em;
  }
  main { display: flex; flex-direction: column; justify-content: center; gap: 22px; z-index: 1; }
  h1 {
    font-family: 'Raleway', sans-serif; font-weight: 700; font-size: 76px;
    line-height: 1.06; color: var(--nr-primary); letter-spacing: -.015em;
  }
  h1 .plain { color: var(--nr-text); }
  p.lead { font-size: 29px; line-height: 1.38; max-width: 900px; font-weight: 400; }
  .rule { width: 88px; height: 5px; background: var(--nr-accent); border-radius: 3px; }
  footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--nr-border); padding-top: 22px;
    font-size: 21px; z-index: 1;
  }
  /* Body-size teal on white is 3.38:1 and fails AA; the brand reference
     prescribes the darker teal #15585E (8.1:1) for exactly this case. */
  footer .url { font-family: 'Raleway', sans-serif; font-weight: 600; color: #15585E; }
  footer .company { font-weight: 400; }
</style>
</head>
