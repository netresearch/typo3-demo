services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Netresearch\DemoSite\:
    resource: '../Classes/*'

  # ---------------------------------------------------------------------------
  # Dashboard cards — one per Netresearch demo extension.
  # All share the DemoExtensionCardWidget class; content is options-driven.
  # ---------------------------------------------------------------------------

  dashboard.widget.nrdemo.llm:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'The shared AI/LLM foundation for TYPO3: centralized provider management, encrypted API keys, and chat, translation, vision, and embedding services used by all other AI extensions on this site.'
        howTo:
          - 'Open Admin Tools > LLM in the module menu.'
          - 'Review the configured providers, models, and task templates.'
          - 'Open the Analytics section to see requests made by Cowriter, Landing Pages, and the AI Agent.'
        moduleRoute: 'nrllm'
        buttonLabel: 'Open LLM module'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.llm'
        groupNames: 'netresearch'
        title: 'NR LLM'
        description: 'AI/LLM foundation — providers, models, and usage analytics'
        iconIdentifier: 'module-nrllm'
        height: 'medium'
        width: 'medium'

  dashboard.widget.nrdemo.mcpagent:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'An AI chat assistant inside the TYPO3 backend. It combines nr-llm with the MCP server, so the agent can use tools to inspect and operate the site while chatting with you.'
        howTo:
          - 'Open Admin Tools > AI Agent in the module menu.'
          - 'Ask a question about the site, e.g. "List the latest news records".'
          - 'Watch the agent call MCP tools and compose an answer from the results.'
        moduleRoute: 'nr_mcp_agent_chat'
        buttonLabel: 'Open AI Agent'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.mcpagent'
        groupNames: 'netresearch'
        title: 'NR MCP Agent'
        description: 'Tool-using AI chat assistant in the TYPO3 backend'
        iconIdentifier: 'module-nr-mcp-agent'
        height: 'medium'
        width: 'medium'

  dashboard.widget.nrdemo.passkeysbe:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Passwordless TYPO3 backend authentication with passkeys (WebAuthn/FIDO2): per-group enforcement policies, enrollment prompts, and an adoption dashboard.'
        howTo:
          - 'Open System > Passkeys to see the adoption dashboard.'
          - 'Register a passkey for your account via User Settings > Passkeys.'
          - 'Log out and sign in again using your fingerprint, face, or security key.'
        moduleRoute: 'admin_passkeys'
        buttonLabel: 'Open Passkeys module'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.passkeysbe'
        groupNames: 'netresearch'
        title: 'NR Passkeys (Backend)'
        description: 'Passwordless backend login via WebAuthn/FIDO2'
        iconIdentifier: 'passkeys-be-module'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.passkeysfe:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Passkey-first login for website users (fe_users): Touch ID, Face ID, Windows Hello, or hardware keys instead of passwords, as a drop-in felogin override.'
        howTo:
          - 'Open the Frontend Passkeys module for the admin overview.'
          - 'Visit /login on the site and log in as demo / demo.'
          - 'Register a passkey via the management plugin, then log in again with it.'
        moduleRoute: 'nr_passkeys_fe'
        buttonLabel: 'Open Frontend Passkeys'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.passkeysfe'
        groupNames: 'netresearch'
        title: 'NR Passkeys (Frontend)'
        description: 'Passkey-first frontend login for website users'
        iconIdentifier: 'nr-passkeys-fe-module'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.repurpose:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Turns a web page or PDF into a podcast, a diagram, and an Instagram story — content repurposing built on the nr-llm foundation.'
        howTo:
          - 'Open Content > Repurpose in the module menu.'
          - 'Create a new job and paste a page URL or upload a PDF.'
          - 'Open the finished job to preview the generated podcast, diagram, and story.'
        moduleRoute: 'web_nrrepurpose'
        buttonLabel: 'Open Repurpose module'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.repurpose'
        groupNames: 'netresearch'
        title: 'NR Repurpose'
        description: 'Turn pages and PDFs into podcasts, diagrams, and stories'
        iconIdentifier: 'tx-nrrepurpose-module'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.vault:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Secure secrets management for TYPO3 with envelope encryption, access control, and audit logging. It stores the API keys used by nr-llm on this site.'
        howTo:
          - 'Open Admin Tools > Vault in the module menu.'
          - 'Inspect the stored secrets and their access scopes.'
          - 'Open the audit log to see who accessed which secret and when.'
        moduleRoute: 'admin_vault'
        buttonLabel: 'Open Vault module'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.vault'
        groupNames: 'netresearch'
        title: 'NR Vault'
        description: 'Encrypted secrets management with audit logging'
        iconIdentifier: 'module-vault'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.temporalcache:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Automatic page-cache invalidation for time-controlled content (starttime/endtime) — addresses the long-standing TYPO3 Forge issue #14277.'
        howTo:
          - 'Open Admin Tools > Temporal Cache in the module menu.'
          - 'Review the upcoming visibility transitions found on this site.'
          - 'Set a starttime on any content element and watch it appear in the schedule.'
        moduleRoute: 'tools_TemporalCache'
        buttonLabel: 'Open Temporal Cache'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.temporalcache'
        groupNames: 'netresearch'
        title: 'NR Temporal Cache'
        description: 'Automatic cache invalidation for timed content'
        iconIdentifier: 'temporal-cache-module'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.landingpage:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Generates complete landing pages with AI from a short briefing: structured content elements, brand colors, and SEO fields — driven by reusable wizard templates.'
        howTo:
          - 'Open Content > Landing Pages in the module menu.'
          - 'Pick a template, e.g. "Product Launch" or "Creative One-Pager".'
          - 'Enter a short briefing and generate — then review the created page in Content > Layout.'
        moduleRoute: 'nr_landingpage'
        buttonLabel: 'Open Landing Pages'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.landingpage'
        groupNames: 'netresearch'
        title: 'NR Landing Page'
        description: 'AI-generated landing pages from wizard templates'
        iconIdentifier: 'nr-landingpage-module'
        height: 'medium'
        width: 'medium'

  dashboard.widget.nrdemo.cowriter:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'An AI writing assistant in CKEditor: rewrite, summarize, translate, or fix grammar of the selected text — right where editors work.'
        howTo:
          - 'Open Content > Layout on Content Examples > Text > Rich Text — that page has a real RTE element to work in.'
          - 'Select some text in the rich text editor and click the Cowriter button in the toolbar.'
          - 'Pick a task from the dropdown, or choose "Custom instruction" and type what should happen.'
          - 'The suggestion appears as a preview — confirm it with "Insert", or use "Retry".'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.cowriter'
        groupNames: 'netresearch'
        title: 'T3 Cowriter'
        description: 'AI writing assistant inside CKEditor'
        iconIdentifier: 'content-widget-text'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.rteimage:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Image support inside the CKEditor 5 rich text editor: insert FAL images, responsive magic-image processing, captions, and click-to-enlarge — no separate image content elements needed.'
        howTo:
          - 'Open Content > Layout and edit the text element on the "RTE CKEditor Image" demo page.'
          - 'Click the image button in the editor toolbar.'
          - 'Pick an image from fileadmin, set alternative text, and save — the frontend renders it responsively.'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.rteimage'
        groupNames: 'netresearch'
        title: 'RTE CKEditor Image'
        description: 'FAL image handling inside the rich text editor'
        iconIdentifier: 'content-image'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.aisearch:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'RAG-based site search and chat: it vectorizes this site''s own pages and answers visitor questions strictly from that content, with a safety gate so an ungrounded answer is never returned as if it were grounded. Built on the nr-llm foundation.'
        howTo:
          - 'Open the "AI Search" demo page in the frontend at /extensions/ai-search.'
          - 'Type a question into the search box, or use the chat widget, and ask about this site.'
          - 'Note that answers stay grounded in the site''s own pages — ungrounded questions are declined, not hallucinated.'
          - 'In the backend, open System > Reports and check the "AI Search" status for indexing and RAG health.'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.aisearch'
        groupNames: 'netresearch'
        title: 'NR AI Search'
        description: 'RAG site search & chat grounded in your own content'
        iconIdentifier: 'actions-search'
        height: 'medium'
        width: 'medium'

  dashboard.widget.nrdemo.browserai:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'An assistant that answers questions about the page a visitor is reading, using Chrome''s built-in Gemini Nano on that visitor''s own device. No API key, no server-side call, no chat history, no telemetry — and nothing metered, which is why its demo page is public where AI Search is not.'
        howTo:
          - 'Open the "Browser AI" demo page in the frontend at /extensions/browser-ai.'
          - 'Without Chrome 148+ and the downloaded model you get the fallback card, which is an ordinary content element the editor picked — that is the point, and it is what most visitors will see.'
          - 'With a supported Chrome, set the model up once, then ask something the page answers and something it does not, to see the grounding hold.'
          - 'In the backend, edit the content element to change its title, introduction, editor instruction, context selector and fallback.'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.browserai'
        groupNames: 'netresearch'
        title: 'NR Browser AI'
        description: 'On-device page assistant, no API key and no server call'
        iconIdentifier: 'actions-comment'
        height: 'medium'
        width: 'medium'

  dashboard.widget.nrdemo.aifilemetadata:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'AI-generated alternative texts for FAL images: a generate button next to the alt-text field, an automatic run on upload, and a CLI command for the existing stock. Preparation for the accessibility requirements of EU Directive 2019/882.'
        howTo:
          - 'Open File > Filelist, pick an image and edit its metadata — the alternative text field carries a generate button.'
          - 'Upload a new image: the alt text is generated on creation (generateAltTextOnFileUpload).'
          - 'For the existing stock, run the bulk command in the web container: vendor/bin/typo3 ai:generate-alt-texts'
          - 'Token spend per run is on the Netresearch Widgets dashboard.'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.aifilemetadata'
        groupNames: 'netresearch'
        title: 'AI File Metadata'
        description: 'AI-generated alternative texts for FAL images'
        iconIdentifier: 'content-widget-text'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.imageoptimize:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'On-demand image optimization for TYPO3: lossless compression on upload, plus lazily generated WebP and AVIF variants and responsive srcset served through the /processed/ URL. A backend module manages and clears the processed-image cache.'
        howTo:
          - 'Open Admin Tools > Image Optimize in the module menu.'
          - 'Review the processed-image statistics, then open "System requirements" to verify the optimizer binaries.'
          - 'Use "Clear processed images" to purge the /processed/ cache, then reload a page to watch variants regenerate on demand.'
        moduleRoute: 'nr_image_optimize'
        buttonLabel: 'Open Image Optimize'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.imageoptimize'
        groupNames: 'netresearch'
        title: 'NR Image Optimize'
        description: 'On-demand WebP/AVIF variants and responsive srcset'
        iconIdentifier: 'module-image-optimize'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.contexts:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Multi-channel content visibility: define contexts from domain, GET parameter, IP range, HTTP header, session value, or a logical combination, then switch pages, menu entries, and single content elements on or off per context — without duplicating the page tree. Visibility is enforced as a Doctrine query restriction, and the active context combination is part of the page cache identifier.'
        howTo:
          - 'Open the Extensions > Contexts page in the frontend at /extensions/contexts — you see the default-channel element.'
          - 'Append ?nrdemo=mobile to that URL and reload: the mobile-channel element replaces it.'
          - 'In the backend, edit either element on that page and open its Contexts panel to see the per-context visibility switches.'
          - 'Open Content > List on the home page to inspect the "Demo channel (mobile)" context record itself (admin only).'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.contexts'
        groupNames: 'netresearch'
        title: 'NR Contexts'
        description: 'Multi-channel content visibility without duplicated page trees'
        iconIdentifier: 'actions-eye'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.textdb:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Moves frontend system strings — form labels, buttons, confirmation messages — out of XLIFF files and into the database, so editors change the wording in the backend without a deployment. Keys are filed by environment, component, and type, and a key rendered for the first time creates its own record.'
        howTo:
          - 'Open Netresearch > TextDb in the module menu.'
          - 'Filter by component "demo" to see the four seeded labels, then switch to the translated view to compare them with their German translations.'
          - 'Use Import to upload an XLIFF file, or Export to download the current filtered set as a ZIP.'
          - 'The records are stored in the "TextDB Translations" folder in the page tree.'
        moduleRoute: 'netresearch_textdb'
        buttonLabel: 'Open TextDb module'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.textdb'
        groupNames: 'netresearch'
        title: 'NR TextDB'
        description: 'Database-backed frontend translations, edited in the backend'
        iconIdentifier: 'extension-netresearch-textdb'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.imagesitemap:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Adds an image sitemap to TYPO3''s SEO sitemap: a second sitemap type listing every image referenced from pages and content elements, with title and caption, in the Google image-sitemap schema. Implemented as an additional XmlSitemapDataProvider for EXT:seo — no scheduler and no extra database tables.'
        howTo:
          - 'Open the Extensions > Image Sitemap page in the frontend for the overview.'
          - 'Open /?type=1642072014 to see the generated image sitemap XML.'
          - 'Compare it with core''s /sitemap.xml, which lists pages but no images.'
          - 'Add an image to any content element, flush the frontend cache, and reload the sitemap to see the new entry.'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.imagesitemap'
        groupNames: 'netresearch'
        title: 'NR Image Sitemap'
        description: 'Image sitemap data provider for EXT:seo'
        iconIdentifier: 'nr_image_sitemap_extension_icon'
        height: 'medium'
        width: 'small'

  dashboard.widget.nrdemo.scheduler:
    class: 'Netresearch\DemoSite\Widgets\DemoExtensionCardWidget'
    arguments:
      $options:
        description: 'Base classes that extend TYPO3''s Scheduler: any task built on them gains e-mail failure reporting and per-application-context execution gating, and declares its configuration form through a typed field builder instead of hand-written HTML. A developer toolkit — it ships no module and no task of its own.'
        howTo:
          - 'Open Admin Tools > Scheduler in the module menu — nr-scheduler extends this core module rather than adding one.'
          - 'Create a task and note the standard fields; the toolkit adds Enable reporting, Reporting emails, Reporting subject, and Environment to tasks that derive from its base classes.'
          - 'Read the Extensions > Scheduler Toolkit page in the frontend for what the base classes provide.'
          - 'Note that this demo has no scheduler runner service, so tasks are configured here but not executed on a cron.'
        moduleRoute: 'scheduler'
        buttonLabel: 'Open Scheduler module'
    tags:
      - name: 'dashboard.widget'
        identifier: 'nrdemo.scheduler'
        groupNames: 'netresearch'
        title: 'NR Scheduler'
        description: 'Failure reporting and context gating for scheduler tasks'
        iconIdentifier: 'module-scheduler'
        height: 'medium'
        width: 'small'
