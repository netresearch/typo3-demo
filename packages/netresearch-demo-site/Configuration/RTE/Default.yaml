# Netresearch Demo Site RTE Configuration
# Extends Bootstrap Package's RTE preset with the rte_ckeditor_image and Cowriter
# plugins. TYPO3 RTE YAML `imports` APPEND list values (they do not overwrite),
# so the imported presets' importModules are already merged in — we only add the
# Cowriter module here, and define our own CKEditor 5 toolbar below.
imports:
    - { resource: "EXT:bootstrap_package/Configuration/RTE/Default.yaml" }
    - { resource: "EXT:rte_ckeditor_image/Configuration/RTE/Plugin.yaml" }

editor:
    config:
        # Bootstrap Package ships a CKEditor 4 `toolbarGroups` definition. TYPO3's
        # CKEditor5Migrator PREFERS `toolbarGroups` over `toolbar` (see
        # CKEditor5Migrator::migrateToolbar()), so the imported groups would
        # discard our CKEditor 5 `toolbar.items` below (dropping the Cowriter
        # button) and rebuild a toolbar that references fontFamily/fontSize/
        # pageBreak — plugins Bootstrap Package does not load, producing
        # `toolbarview-item-unavailable` console warnings. Override both legacy
        # keys with a non-array scalar so the migrator falls through to our
        # explicit `toolbar.items`. (Because imports append list values, a list
        # override cannot clear them — a scalar wins the merge and defeats the
        # migrator's `is_array()` checks. Empty strings, not `false`, keep the
        # migrator's `removeButtons` handling on its warning-free string path.)
        toolbarGroups: ''
        removeButtons: ''

        importModules:
            # Cowriter plugin (Bootstrap Package + rte_ckeditor_image modules are
            # contributed by the imports above).
            - { module: '@netresearch/t3_cowriter/cowriter', exports: ['Cowriter'] }

        toolbar:
            items:
                - style
                - heading
                - '|'
                - bold
                - italic
                - underline
                - strikethrough
                - subscript
                - superscript
                - softhyphen
                - '|'
                - insertimage
                - link
                - '|'
                - alignment
                - '|'
                - bulletedList
                - numberedList
                - indent
                - outdent
                - '|'
                - specialCharacters
                - insertTable
                - horizontalLine
                - '|'
                - removeFormat
                - sourceEditing
                - '|'
                # All four components the extension registers. Importing the
                # module alone is not enough — an explicit toolbar.items list
                # decides what appears, and this one named only the first, so
                # vision, translation and tasks stayed invisible on the demo.
                - cowriter
                - cowriterVision
                - cowriterTranslate
                - cowriterTemplates
