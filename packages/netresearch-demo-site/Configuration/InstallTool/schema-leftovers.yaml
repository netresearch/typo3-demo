# Tables, columns and indexes that `make remove-schema-leftovers`
# (demo:schema:remove-leftovers) deletes from the database. README.md#schema-leftovers
# explains the command.
#
# Every object here was a removal suggestion of Maintenance > Analyze Database
# Structure on the live instance (Deploy (Update) run 41196474472, see #397):
# left over from extensions and core versions this project no longer
# installs. No ext_tables.sql and no TCA of the locked packages defines any of
# them.
#
# The list is explicit on purpose. The command never removes an object that is
# not named here, and it removes a named one only while the core schema
# comparison still suggests removing it; otherwise it logs the object and
# leaves it alone. A future removal suggestion is therefore reported by
# `make install-tool-check` instead of disappearing on the next deploy.
#
#   tables:  table names
#   columns: table name => column names
#   indexes: table name => index names
tables:
  - cache_hash
  - cache_hash_tags
  - cache_nr_mcp_agent_tools
  - cache_nr_mcp_agent_tools_tags
  - cache_pages
  - cache_pages_tags
  - cache_rootline
  - cache_rootline_tags
  - cache_treelist
  - index_config
  - index_debug
  - index_fulltext
  - index_grlist
  - index_phash
  - index_rel
  - index_section
  - index_stat_word
  - index_words
  - sys_language
  - sys_note
  - tx_mcpserver_access_tokens
  - tx_mcpserver_oauth_clients
  - tx_mcpserver_oauth_codes
  - tx_news_domain_model_news_ttcontent_mm
  - tx_nrllm_prompttemplate
columns:
