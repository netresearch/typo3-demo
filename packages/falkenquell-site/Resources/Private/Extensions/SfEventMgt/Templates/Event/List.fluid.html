<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="main">

    <f:if condition="{pagination}">
        <f:then>
            <ul class="event-cards">
                <f:for each="{pagination.paginator.paginatedItems}" as="event" iteration="iterator">
                    <f:render partial="Event/ListItem" arguments="{_all}"/>
                </f:for>
            </ul>
            <f:render partial="Event/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator, overwriteDemand: overwriteDemand}" />
        </f:then>
        <f:else>
            <ul class="event-cards">
                <f:for each="{events}" as="event">
                    <f:render partial="Event/ListItem" arguments="{_all}"/>
                </f:for>
            </ul>
        </f:else>
    </f:if>

    <f:if condition="{settings.queryLimit} && {settings.listPid}">
        <p class="event-cards-more">
            <f:link.page pageUid="{settings.listPid}" class="btn btn-primary"><f:translate domain="sf_event_mgt.messages" key="event.allEvents" /></f:link.page>
        </p>
    </f:if>

</f:section>

</html>
