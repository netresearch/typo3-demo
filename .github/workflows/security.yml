name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    uses: netresearch/.github/.github/workflows/gitleaks.yml@main
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: netresearch/.github/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
      pull-requests: write

  composer-audit:
    uses: netresearch/typo3-ci-workflows/.github/workflows/security.yml@main
    # The reusable runs `composer install` on a hosted runner with only the
    # default GitHub token; it has no input/secret to pass COMPOSER_AUTH, so it
    # cannot authenticate to the private git.netresearch.de source that provides
    # netresearch/nr-ai-search (an internal-only extension, never on Packagist).
    # Skipping only the Composer dependency audit keeps the rest of the reusable
    # (Opengrep SAST) and the sibling gitleaks/dependency-review jobs running.
    # The image build (build.yml) is the authoritative dependency-resolution
    # gate and does carry the GitLab token via GITLAB_COMPOSER_TOKEN.
    with:
      skip-composer-audit: true
