name: Instance Remediation

# Dispatch-only, for the findings that can only be answered on the instance:
# the exception behind a backend 500, the vault audit chain, and the agent's
# file-writing tools. Everything read-only runs unconditionally; each write is
# behind its own input and defaults to off.
#
# WHAT IS PRINTED. This repository is public, so the output is bounded on
# purpose: exception SUBJECT lines rather than full traces, the audit verifier's
# own report, and row counts. No environment dump, no configuration file, no
# secret value. The vault audit report names uids and reason codes, which is
# what the finding asks to be reconciled and carries nothing confidential on an
# instance holding one demo secret.
#
# WHY NOT A FREE-FORM COMMAND INPUT. A dispatchable "run this on production"
# button in a public repository is a standing remote-exec capability, and the
# review of it would be about the button rather than about these findings. Every
# command below is written out here and reviewable as text.

on:
  workflow_dispatch:
    inputs:
      migrate_audit_hmac:
        description: "Re-sign the audit chain to HMAC epoch 3 (vault:audit-migrate-hmac). Run the verification first and read its report."
        type: boolean
        default: false
      enable_file_tools:
        description: "Enable the agent's FAL tools (attach_file_to_content_element, set_file_alternative_text)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect and remediate on Hetzner
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: MIGRATE_AUDIT_HMAC,ENABLE_FILE_TOOLS
          script: |
            set -eu
            cd /opt/typo3-demo

            t3() { docker compose exec -T web vendor/bin/typo3 "$@"; }
            sql() {
              printf '%s' "$1" | docker compose exec -T db sh -c \
                'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -t -u "$MARIADB_USER" "$MARIADB_DATABASE"'
            }

            echo "===== deployed revision"
            git log -1 --format='%h %ci %s'

            echo
            echo "===== backend exceptions, most recent first (subject lines only)"
            # The 500 on /typo3/module/nrllm/configurations. TYPO3 writes the
            # exception to var/log; the trace is deliberately not printed.
            docker compose exec -T web sh -c '
              found=0
              for f in $(ls -1t var/log/typo3_*.log 2>/dev/null | head -3); do
                found=1
                echo "--- $f"
                # grep exits 1 on no match, which is a normal outcome here and
                # must not end the loop: under `set -e` the first quiet log file
                # would skip the rest and the caller would report "no readable
                # log files" for logs it never opened.
                grep -iE "critical|error" "$f" 2>/dev/null | tail -25 | cut -c1-400 \
                  || echo "(no matching lines in this file)"
              done
              [ "$found" = 1 ] || echo "(no log files under var/log)"
            '

            echo
            echo "===== vault: audit chain verification (read-only)"
            # Read the report BEFORE any re-sealing: re-sealing a tampered chain
            # launders it into a valid one, so this runs unconditionally and the
            # migration below is opt-in.
            t3 vault:audit-verify || echo "(vault:audit-verify exited non-zero — that is the finding, not a workflow error)"

            echo
            echo "===== nr-llm: current tool overrides"
            sql "SELECT tool_name, enabled FROM tx_nrllm_tool_state ORDER BY tool_name;"

            echo
            echo "===== nr-llm: current tool GROUP overrides"
            # A per-tool row does not win over a disabled group: the runtime gate
            # is fail-closed and a disabled group also covers tools installed
            # later (nr-llm ext_tables.sql, tx_nrllm_tool_group_state). Without
            # this the output could show a tool enabled while it stays
            # unreachable, and the next step would be taken against the wrong
            # cause. A missing row means the group is enabled.
            sql "SELECT group_name, enabled FROM tx_nrllm_tool_group_state ORDER BY group_name;"

            if [ "${MIGRATE_AUDIT_HMAC}" = "true" ]; then
              echo
              echo "===== vault: re-signing the audit chain to epoch 3"
              t3 vault:audit-migrate-hmac
              echo "----- verification after the migration"
              t3 vault:audit-verify || echo "(still failing after the migration — do not re-run, read the report)"
            fi

            if [ "${ENABLE_FILE_TOOLS}" = "true" ]; then
              echo
              echo "===== nr-llm: enabling the file tools"
              # A missing row means "use the tool's own default", and both of
              # these default to off (nr-llm ADR-135). An explicit row is what
              # turns them on; the unique key on tool_name makes this idempotent.
              sql "INSERT INTO tx_nrllm_tool_state (pid, tool_name, enabled) VALUES
                     (0, 'attach_file_to_content_element', 1),
                     (0, 'set_file_alternative_text', 1)
                   ON DUPLICATE KEY UPDATE enabled = 1;"
              sql "SELECT tool_name, enabled FROM tx_nrllm_tool_state ORDER BY tool_name;"
              echo "----- flushing caches so the registry is rebuilt"
              t3 cache:flush
            fi

            echo
            echo "===== done"
        env:
          MIGRATE_AUDIT_HMAC: ${{ inputs.migrate_audit_hmac }}
          ENABLE_FILE_TOOLS: ${{ inputs.enable_file_tools }}
