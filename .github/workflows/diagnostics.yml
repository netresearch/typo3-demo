name: Remote Diagnostics

# Read-only diagnostics of the live instance (DB login history, backend
# users, passkey credentials, container/volume state). The repo is public,
# so the collected report is encrypted with the DIAG_PASSPHRASE secret
# before it reaches the workflow log. Decrypt locally with:
#   sed -n '/^DIAG-BEGIN$/,/^DIAG-END$/p' log | sed '1d;$d' \
#     | openssl enc -d -aes-256-cbc -pbkdf2 -pass file:passphrase.txt -a -A | gunzip

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Collect diagnostics on Hetzner
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ vars.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DIAG_PASSPHRASE
          script: |
            set -e
            cd /opt/typo3-demo
            if [ -z "$DIAG_PASSPHRASE" ]; then
              echo "ERROR: DIAG_PASSPHRASE secret is not set" >&2
              exit 1
            fi
            q() {
              echo "===== $1"
              printf '%s' "$2" | docker compose exec -T db sh -c \
                'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -t -u "$MARIADB_USER" "$MARIADB_DATABASE"' 2>&1 || true
              echo
            }
            collect() {
              echo "===== host"
              date -u; uptime; last reboot 2>/dev/null | head -3
              echo "===== deployed revision"
              git log -1 --format='%h %ci %s'; ls -la .env 2>/dev/null | awk '{print $6, $7, $8, $9}'
              echo "===== containers"
              docker ps --format '{{.Names}}\t{{.CreatedAt}}\t{{.Status}}'
              echo "===== volumes"
              for v in typo3-db typo3-fileadmin typo3-var typo3-config; do
                printf '%s\t' "typo3-demo_$v"
                docker volume inspect "typo3-demo_$v" --format '{{.CreatedAt}}' 2>/dev/null || echo missing
              done
              q "be_users" "SELECT uid, username, admin, deleted, disable, FROM_UNIXTIME(crdate) crdate, FROM_UNIXTIME(tstamp) tstamp, FROM_UNIXTIME(lastlogin) lastlogin FROM be_users;"
              q "be passkey credentials" "SELECT be_user, label, aaguid, transports, FROM_UNIXTIME(created_at) created_at, FROM_UNIXTIME(last_used_at) last_used_at, revoked_at FROM tx_nrpasskeysbe_credential;"
              q "fe passkey credentials" "SELECT COUNT(*) fe_passkeys FROM tx_nrpasskeysfe_credential;"
              q "sys_log span" "SELECT COUNT(*) cnt, FROM_UNIXTIME(MIN(tstamp)) oldest, FROM_UNIXTIME(MAX(tstamp)) newest FROM sys_log;"
              q "login log (type=255)" "SELECT FROM_UNIXTIME(tstamp) t, error, details, LEFT(log_data, 200) log_data_head FROM sys_log WHERE type=255 ORDER BY tstamp DESC LIMIT 60;"
              q "be_users history" "SELECT FROM_UNIXTIME(tstamp) t, recuid, userid, actiontype, LEFT(history_data, 200) data_head FROM sys_history WHERE tablename='be_users' ORDER BY tstamp DESC LIMIT 20;"
              q "recent errors" "SELECT FROM_UNIXTIME(tstamp) t, type, error, LEFT(details, 160) details_head FROM sys_log WHERE error > 0 ORDER BY tstamp DESC LIMIT 30;"
              q "nr-llm providers" "SELECT uid, identifier, adapter_type, endpoint_url, LENGTH(api_key) api_key_len, is_active FROM tx_nrllm_provider;"
              q "nr-vault secrets" "SELECT COUNT(*) vault_secrets FROM tx_nrvault_secret;"
              # Seeded demo pages. INSERT IGNORE skips silently when a uid is already
              # taken in the LIVE database (db.sql.gz lags behind), which is how the
              # Contexts page ended up missing while its neighbours rendered.
              q "seeded demo pages" "SELECT uid, pid, sys_language_uid lang, deleted, hidden, slug, title FROM pages WHERE uid BETWEEN 155 AND 185 ORDER BY uid;"
              # Seeded demo content elements. The re-assert added in #96 restores the
              # structural fields but deliberately leaves bodytext alone, so a record
              # created by an earlier seed run keeps whatever bodytext that run gave
              # it. bodytext_len distinguishes a stale/empty body (element renders as
              # an empty frame) from a rendering problem (frame absent entirely).
              q "seeded demo content" "SELECT uid, pid, CType, sys_language_uid lang, l18n_parent, colPos, sorting, hidden, deleted, LENGTH(bodytext) bodytext_len, header FROM tt_content WHERE uid BETWEEN 600 AND 630 ORDER BY uid;"
              # EXT:form details behind the counts printed in plain text below:
              # form names and file paths, and a log line, which can name
              # anything the wizard logs.
              echo "===== EXT:form forms in file mounts (form:definition:transfer --dry-run)"
              docker compose exec -T -u www-data web vendor/bin/typo3 form:definition:transfer \
                --source=filemount --target=database --dry-run 2>&1 || true
              # Newest warning: the last match in the most recently written log
              # file that has one. Within a file, records are appended in order.
              echo "===== EXT:form wizard warning, newest"
              docker compose exec -T web sh -c \
                'for f in $(ls -t var/log/*.log 2>/dev/null); do m=$(grep -h "Could not list file-based forms" "$f" | tail -n 1); if [ -n "$m" ]; then echo "$f: $m" | cut -c1-400; break; fi; done' || true
              q "EXT:form database forms" "SELECT uid, pid, deleted, identifier, label FROM form_definition ORDER BY uid;"
              q "EXT:form content elements" "SELECT uid, pid, hidden, deleted, SUBSTRING(pi_flexform, LOCATE('settings.persistenceIdentifier', pi_flexform) + 31, 90) persistence_identifier FROM tt_content WHERE CType = 'form_formframework' ORDER BY uid;"
            }
            enc() {
              if command -v openssl >/dev/null 2>&1; then
                openssl enc -aes-256-cbc -pbkdf2 -pass env:DIAG_PASSPHRASE -a -A
              else
                docker compose exec -T -e DIAG_PASSPHRASE web \
                  openssl enc -aes-256-cbc -pbkdf2 -pass env:DIAG_PASSPHRASE -a -A
              fi
            }
            # IPv6 reachability, in plain text: nothing here is secret (the
            # address is in public DNS, the firewall rules are the ones
            # deploy/hetzner-setup.sh writes), and no network we can reach
            # has IPv6 egress, so this is the only place to test it from.
            # Listening sockets are limited to :80 and :443. Each probe may
            # fail without ending the run; a failure is the finding.
            ipv6() {
              echo "===== ipv6: addresses"
              ip -6 addr show scope global 2>&1 || true
              echo "===== ipv6: routes"
              ip -6 route show 2>&1 || true
              echo "===== ipv6: listeners on :80 and :443"
              ss -ltnH 2>&1 | awk "\$4 ~ /:(80|443)\$/" || true
              echo "===== ipv6: own address, Host typo3-demo.netresearch.de"
              aaaa=$(ip -6 addr show scope global | awk "/inet6/ {sub(/\/.*/, \"\", \$2); print \$2; exit}")
              echo "address: ${aaaa:-none}"
              if [ -n "$aaaa" ]; then
                curl -6 -sS -o /dev/null --max-time 15 -w "HTTP %{http_code}\n" \
                  --resolve "typo3-demo.netresearch.de:443:[$aaaa]" https://typo3-demo.netresearch.de/ 2>&1 || true
              fi
              echo "===== ipv6: egress control (www.google.com)"
              curl -6 -sS -o /dev/null --max-time 15 -w "HTTP %{http_code}\n" https://www.google.com/ 2>&1 || true
              echo "===== ipv6: ufw"
              grep IPV6 /etc/default/ufw 2>&1 || true
              sudo -n ufw status verbose 2>&1 || echo "(ufw status needs root)"
              echo "===== ipv6: docker"
              grep -s -i ipv6 /etc/docker/daemon.json || echo "(no ipv6 key in /etc/docker/daemon.json)"
              docker network inspect typo3-demo_default --format "typo3-demo_default EnableIPv6={{.EnableIPv6}}" 2>&1 || true
            }
            ipv6

            # Open upgrade wizards, in plain text: identifiers and titles
            # only. Reports > Status names no wizard, and the Upgrade module
            # sits behind sudo mode, so this is the read-only way to see which
            # one keeps "Remaining updates" open. upgrade:list runs nothing.
            echo "===== upgrade wizards (upgrade:list)"
            docker compose exec -T -u www-data web vendor/bin/typo3 upgrade:list 2>&1 || true
            # EXT:form's formFileFormsToDatabaseMigration answers only in a web
            # request: on the CLI no request exists, the Extbase configuration
            # manager throws NoServerRequestGivenException, and the wizard turns
            # that into "nothing to migrate" plus a log warning (TYPO3 14.3.10).
            # So upgrade:list cannot show it (#411). form:definition:transfer
            # builds a request of its own; --dry-run only lists. Counts only
            # here: names, paths and the log line are in the encrypted report.
            echo "===== EXT:form forms left in file mounts (count)"
            docker compose exec -T -u www-data web vendor/bin/typo3 form:definition:transfer \
              --source=filemount --target=database --dry-run 2>&1 \
              | grep -o -E 'Found [0-9]+ form\(s\)|No forms found' || true
            echo "===== EXT:form wizard warnings in var/log (count)"
            docker compose exec -T web sh -c \
              'cat var/log/*.log 2>/dev/null | grep -c "Could not list file-based forms"' || true
            q "EXT:form counts" "SELECT (SELECT COUNT(*) FROM form_definition WHERE deleted = 0) database_forms, (SELECT COUNT(*) FROM tt_content WHERE CType = 'form_formframework' AND deleted = 0 AND hidden = 0 AND pi_flexform REGEXP '>[0-9]+:/[^<]*[.]form[.]yaml<') visible_form_elements_on_file_mounts;"
            # rteImageReferenceValidation stays listed while ANY issue remains,
            # including the ones it cannot fix. The validator's dry-run report
            # is cut to type, table, uid, field and fixable: enough to name the
            # issue, without the image paths of possibly unpublished content.
            echo "===== RTE image references (rte_ckeditor_image:validate, dry run)"
            docker compose exec -T -u www-data web vendor/bin/typo3 rte_ckeditor_image:validate 2>&1 \
              | awk -F"|" "NF >= 9 {print \$2 \"|\" \$3 \"|\" \$4 \"|\" \$5 \"|\" \$9; next} !/\|/ {print}" || true
            # Which configuration the latest LLM calls asked for and which one
            # answered, in plain text: configuration identifiers and model
            # names, no prompt, no answer, no user. This is how a site's own
            # configuration (nr-llm ADR-244) is seen on a real call.
            q "nr-llm telemetry (latest 15 calls)" "SELECT uid, FROM_UNIXTIME(crdate) t, source_extension, source_operation, operation, configuration_identifier, served_configuration_identifier, served_model, success FROM tx_nrllm_telemetry ORDER BY uid DESC LIMIT 15;"
            # Rows whose served_model came out empty, by configuration and
            # caller: identifiers and counts only.
            q "nr-llm telemetry: empty served_model" "SELECT configuration_identifier, source_extension, source_operation, COUNT(*) calls, FROM_UNIXTIME(MAX(crdate)) newest FROM tx_nrllm_telemetry WHERE served_model = '' GROUP BY configuration_identifier, source_extension, source_operation ORDER BY calls DESC LIMIT 30;"
            # How tool calls of agent runs ended, by tool and by the class of
            # error text: tool names and counts only, never the text itself,
            # which can name a record. argument = the tool refused a value of
            # its arguments; generic_failed = the tool threw and the model was
            # told only that it failed; schema_refused_arguments /
            # schema_refused_turn = nr-llm refused the turn before the tool
            # ran, from the run step's toolRefusal code (nr-llm ADR-246).
            q "nr-llm tool calls by outcome (all runs)" "SELECT JSON_VALUE(payload, '$.toolName') tool, CASE WHEN JSON_VALUE(payload, '$.toolRefusal') IS NOT NULL THEN CONCAT('schema_refused_', JSON_VALUE(payload, '$.toolRefusal')) WHEN COALESCE(JSON_VALUE(payload, '$.toolIsError'), '0') NOT IN ('1', 'true') THEN 'ok' WHEN JSON_VALUE(payload, '$.toolResult') IS NULL THEN 'error_no_text' WHEN JSON_VALUE(payload, '$.toolResult') LIKE 'Error: tool % failed.' THEN 'generic_failed' WHEN JSON_VALUE(payload, '$.toolResult') REGEXP '^(Refused|Error): (.[a-z_]+. (must|is required|is longer)|the value for)' THEN 'argument' WHEN JSON_VALUE(payload, '$.toolResult') LIKE 'Error: unknown tool%' OR JSON_VALUE(payload, '$.toolResult') LIKE 'Error: tool % not permitted%' OR JSON_VALUE(payload, '$.toolResult') LIKE 'Error: invocation denied%' THEN 'not_permitted' WHEN JSON_VALUE(payload, '$.toolResult') LIKE 'Refused:%' THEN 'refused_other' ELSE 'error_other' END outcome, COUNT(*) calls, FROM_UNIXTIME(MAX(crdate)) newest FROM tx_nrllm_agentrun_event WHERE kind = 'tool' GROUP BY tool, outcome ORDER BY tool, outcome;"
            # How many plain chat/completion calls of the last 90 days repeated
            # an earlier successful call of the same caller and configuration
            # with the same request shape (message count, payload bytes, token
            # estimate) that had finished before it started (crdate is written
            # at the end of a call, latency_ms back) and within 1 h / 24 h. The row stores no prompt, so equal
            # shape is necessary for an answer-cache hit, not sufficient: this
            # is an upper bound. Identifiers and counts only.
            q "nr-llm answer-cache replay (upper bound, 90 days)" "SELECT a.operation, a.configuration_identifier, a.source_extension, a.source_operation, COUNT(*) calls, SUM(a.facts_payload_bytes IS NULL) no_facts, SUM(EXISTS(SELECT 1 FROM tx_nrllm_telemetry b WHERE b.uid < a.uid AND b.crdate <= a.crdate - a.latency_ms DIV 1000 AND b.crdate >= a.crdate - a.latency_ms DIV 1000 - 3600 AND b.success = 1 AND b.operation = a.operation AND b.configuration_identifier = a.configuration_identifier AND b.source_extension = a.source_extension AND b.source_operation = a.source_operation AND b.facts_messages = a.facts_messages AND b.facts_payload_bytes = a.facts_payload_bytes AND b.facts_token_estimate <=> a.facts_token_estimate)) same_shape_1h, SUM(EXISTS(SELECT 1 FROM tx_nrllm_telemetry b WHERE b.uid < a.uid AND b.crdate <= a.crdate - a.latency_ms DIV 1000 AND b.crdate >= a.crdate - a.latency_ms DIV 1000 - 86400 AND b.success = 1 AND b.operation = a.operation AND b.configuration_identifier = a.configuration_identifier AND b.source_extension = a.source_extension AND b.source_operation = a.source_operation AND b.facts_messages = a.facts_messages AND b.facts_payload_bytes = a.facts_payload_bytes AND b.facts_token_estimate <=> a.facts_token_estimate)) same_shape_24h FROM tx_nrllm_telemetry a WHERE a.operation IN ('chat', 'complete', 'stream') AND a.crdate > UNIX_TIMESTAMP() - 90 * 86400 GROUP BY a.operation, a.configuration_identifier, a.source_extension, a.source_operation ORDER BY calls DESC LIMIT 40;"
            # Latency and actual cost per served model over 30 days, the
            # signals a router could rank on: model names and numbers only.
            q "nr-llm latency and cost by served model (30 days)" "SELECT served_provider, served_model, operation, COUNT(*) calls, SUM(success = 0) failed, ROUND(AVG(latency_ms)) avg_ms, MAX(latency_ms) max_ms, SUM(actual_cost IS NOT NULL) costed, ROUND(SUM(actual_cost), 8) cost_usd, ROUND(AVG(actual_cost), 8) avg_cost_usd FROM tx_nrllm_telemetry WHERE crdate > UNIX_TIMESTAMP() - 30 * 86400 AND served_model <> '' GROUP BY served_provider, served_model, operation ORDER BY calls DESC LIMIT 40;"

            echo "DIAG-BEGIN"
            collect | gzip | enc
            echo
            echo "DIAG-END"
        env:
          DIAG_PASSPHRASE: ${{ secrets.DIAG_PASSPHRASE }}
