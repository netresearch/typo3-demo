name: Host Maintenance

# Dispatch-only. Reclaims disk on the demo host by pruning UNUSED docker
# images and build cache — never volumes (the DB/seed/fileadmin/config named
# volumes are preserved), so no data is lost. Reports df before/after, then
# completes the pending code update (make update).

on:
  workflow_dispatch:
    inputs:
      run_update:
        description: "Run 'make update' after pruning"
        type: boolean
        default: true
      recreate_containers:
        description: "Also recreate containers (frees their writable layers; named volumes are kept)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prune docker images/build-cache and update on Hetzner
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: RUN_UPDATE,RECREATE_CONTAINERS
          script: |
            set -e
            echo "===== df BEFORE"
            df -h /
            echo "===== docker disk usage BEFORE"
            docker system df || true
            echo "===== container writable layers (SIZE = writable layer)"
            # `docker system df` only reports the SUM over all containers. When
            # that sum is large while images and volumes are small, the space is
            # sitting in one container's writable layer (anything written inside
            # the container instead of onto a named volume, e.g. typo3temp).
            docker ps -a --size --format 'table {{.Names}}\t{{.Size}}\t{{.Status}}' || true
            echo "===== pruning unused images + build cache (NOT volumes)"
            docker image prune -af
            docker builder prune -af
            echo "===== stopped containers"
            docker container prune -f || true
            echo "===== df AFTER prune"
            df -h /
            if [ "$RECREATE_CONTAINERS" = "true" ]; then
              # Recreating drops every container writable layer. Named volumes
              # (typo3-db, typo3-fileadmin, typo3-var, typo3-config, caddy-*)
              # are NOT touched, so database, fileadmin, var and the system
              # config survive; regenerable content such as typo3temp is rebuilt
              # on the next request.
              echo "===== recreating containers (named volumes are preserved)"
              cd /opt/typo3-demo
              docker compose down --remove-orphans
              docker compose up -d --wait --wait-timeout 180 || docker compose up -d
              echo "===== df AFTER recreate"
              df -h /
            fi
            if [ "$RUN_UPDATE" = "true" ]; then
              echo "===== make update"
              cd /opt/typo3-demo
              git pull --ff-only
              git lfs pull
              make update
              echo "===== df AFTER update"
              df -h /
            fi
        env:
          RUN_UPDATE: ${{ github.event.inputs.run_update }}
          RECREATE_CONTAINERS: ${{ github.event.inputs.recreate_containers }}
