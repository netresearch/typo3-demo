name: Set AI Tasks Editor Password

# Sets the password of the demo editor redakteur_ki (be_users 1000, seeded by
# data/seed-extensions.sql step 3c6) to the value of the
# TYPO3_BE_EDITOR_KI_PASSWORD repository secret. Manual trigger only.
#
# Unlike "Reset BE Admin Password", this never makes the account an
# administrator and never creates it: it updates only the seeded non-admin row
# and fails when that row is missing. The password never appears in logs — it
# travels as a masked secret and only its Argon2id hash reaches the database.
# The seed never touches the password again, so the hash survives every deploy;
# run this once after a fresh install or a reset.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  set-password:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set the redakteur_ki password on Hetzner
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ vars.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: TYPO3_BE_EDITOR_KI_PASSWORD
          script: |
            set -e
            cd /opt/typo3-demo
            if [ -z "$TYPO3_BE_EDITOR_KI_PASSWORD" ]; then
              echo "ERROR: TYPO3_BE_EDITOR_KI_PASSWORD secret is not set" >&2
              exit 1
            fi
            HASH=$(docker compose exec -T -e PW="$TYPO3_BE_EDITOR_KI_PASSWORD" web \
              php -r 'echo password_hash(getenv("PW"), PASSWORD_ARGON2ID);')
            ROWS=$(docker compose exec -T db sh -c \
              'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -N -u "$MARIADB_USER" "$MARIADB_DATABASE"' <<SQL
            UPDATE be_users
              SET password='$HASH', tstamp=UNIX_TIMESTAMP()
              WHERE uid=1000 AND username='redakteur_ki' AND admin=0 AND deleted=0;
            SELECT COUNT(*) FROM be_users
              WHERE uid=1000 AND username='redakteur_ki' AND admin=0 AND deleted=0
                AND password='$HASH';
            SQL
            )
            if [ "$ROWS" != "1" ]; then
              echo "ERROR: be_users 1000 redakteur_ki is missing, deleted or an administrator; nothing was set" >&2
              exit 1
            fi
            echo "Password set for redakteur_ki."
        env:
          TYPO3_BE_EDITOR_KI_PASSWORD: ${{ secrets.TYPO3_BE_EDITOR_KI_PASSWORD }}
