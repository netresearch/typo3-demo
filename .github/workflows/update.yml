name: Deploy (Update)

on:
  workflow_run:
    workflows: ["Build"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DHI_USERNAME,DHI_TOKEN,OPENAI_API_KEY,DEEPL_API_KEY
          script: |
            cd /opt/typo3-demo

            # The db service runs the MariaDB Docker Hardened Image and dhi.io
            # serves no anonymous pulls, so `make update` cannot pull without a
            # login. Docker keeps the credential in the host's config.json, but
            # logging in per deploy also survives a wiped host.
            echo "${DHI_TOKEN}" | docker login dhi.io -u "${DHI_USERNAME}" --password-stdin

            # A full disk makes `git pull` fail with "write error. Out of
            # diskspace" while it writes the index, which reads like a git
            # problem and cost an incident to trace. Check first and say so.
            AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')
            echo "free space on /: ${AVAIL_MB} MB"
            if [ "${AVAIL_MB}" -lt 2048 ]; then
              echo "Less than 2048 MB free - reclaiming before the update."
              docker image prune -af || true
              docker builder prune -af || true
              docker container prune -f || true
              AVAIL_MB=$(df -Pm / | awk 'NR==2 {print $4}')
              echo "free space after prune: ${AVAIL_MB} MB"
            fi
            if [ "${AVAIL_MB}" -lt 512 ]; then
              echo "::error::Only ${AVAIL_MB} MB free on / - aborting before git touches the index."
              echo "Run the Maintenance workflow with recreate_containers=true: a container"
              echo "writable layer (not images) is the usual cause; see docker ps -a --size."
              df -h /
              exit 1
            fi

            git pull --ff-only
            make update
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
          # Consumed by `make provision-llm-key` inside `make update`. Absent or
          # empty, the deploy still succeeds and says the AI modules stay dead —
          # a missing key must not take the whole instance down with it.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Consumed by `make provision-deepl-key` inside `make update`, which
          # writes it into the host .env so it survives a reboot. Absent or empty,
          # a key already stored on the host is kept and the deploy still succeeds.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
