name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required by the merge queue: `build` is a required check, and a required
  # check that never reports on a merge group is treated as failed once
  # check_response_timeout_minutes elapses, ejecting every queued entry.
  merge_group:
  # Manual re-trigger: rebuilds the image so dev-main VCS deps (e.g.
  # netresearch/nr-ai-search) are re-resolved without a code change on main.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      # Build the local LFS checkout (docker-bake.hcl target "web" has
      # context "."); push only on main. GIT_SHA feeds the HCL sha tag.
      # Trivy scan stays off to match the previous inline build.
      bake-source: .
      lfs: true
      # workflow_dispatch exists to rebuild and republish the image — without
      # push the manual rebuild produced an image that never left the runner.
      push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
      scan: false
      pre-build-command: echo "GIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      # NRS-4588 phase 1: merge the declared Composer SBOM (from the committed
      # composer.lock) with the Syft image scan and attach it to the digest as
      # a Cosign CycloneDX attestation. Only runs where push is true.
      sbom-attest: true
    secrets:
      # gitlab-token, not http-basic: GITLAB_COMPOSER_TOKEN is a project access
      # token, and GitLab's API only accepts those via the PRIVATE-TOKEN header
      # (basic auth answers 404) — gitlab-token makes Composer send exactly that.
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}, "gitlab-token": {"git.netresearch.de": "${{ secrets.GITLAB_COMPOSER_TOKEN }}"}}'

  # GitHub-issued SBOM attestation on top of the Cosign one, verifiable with
  # `gh attestation verify oci://<image>@<digest> --owner netresearch`. Separate
  # reusable because it needs `attestations: write`, which build-container-bake
  # deliberately does not require. Guarded by the same condition as the `push`
  # input above: without a pushed image there is no digest to attest, and the
  # reusable fails rather than no-ops.
  attest-sbom:
    needs: build
    # Same condition as the push input above — a dispatch rebuild pushes too.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: netresearch/.github/.github/workflows/attest-sbom.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      # subjects, not bake-metadata: GitHub masks the raw metadata output away
      # entirely when it matches a secret (tokens in build args), which
      # silently emptied the attest matrix (run 31057574829).
      subjects: ${{ needs.build.outputs.sbom-subjects }}

  # Runs on main *and* on pull requests, but gets its image from a different
  # place in each case. On main `build` has just published the image, so pulling
  # it validates the exact artifact the deploy will roll out. On a pull request
  # nothing is published — `build` sets `push` false there — so a `docker compose
  # pull` would fetch main's `:latest` and report on code the PR does not
  # contain. That is worse than not running, because it looks like a safeguard.
  # The pull-request path therefore builds the image here and loads it into the
  # local daemon under the tag compose.yml names.
  #
  # Forks are excluded: the build needs COMPOSER_AUTH for the private
  # git.netresearch.de VCS repository, and secrets are not exposed to them.
  validate:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      # The db service runs the MariaDB Docker Hardened Image; dhi.io serves no
      # anonymous pulls, so the stack cannot come up without this.
      - name: Log in to dhi.io
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: echo "$DHI_TOKEN" | docker login dhi.io -u "$DHI_USERNAME" --password-stdin

      # docker-container driver: the default docker driver cannot read the GHA
      # layer cache, and without that cache this rebuilds composer install and
      # the whole TYPO3 tree on every pull request.
      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Same bake target the published image comes from, so a change to the
      # build definition is exercised here too rather than only after a merge.
      # `--file docker-bake.hcl` is what makes that true rather than lucky: the
      # reusable passes the same file, and without it bake also merges
      # compose.yml, whose `web` service declares its own build context.
      # Overrides: one platform, because `--load` cannot take a multi-platform
      # result; and no cache export, because `build` already wrote the cache
      # this run reads and a second writer buys nothing.
      #
      # GIT_SHA stays unset, so the HCL emits exactly one tag,
      # ghcr.io/netresearch/typo3-demo:latest — the tag compose.yml resolves.
      - name: Build the image under test
        if: github.event_name == 'pull_request'
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}, "gitlab-token": {"git.netresearch.de": "${{ secrets.GITLAB_COMPOSER_TOKEN }}"}}'
        run: |
          # Pre-flight, because this step failed once with "Invalid credentials"
          # against git.netresearch.de while the `build` job resolved the very
          # same package from the very same URL in the same run. Structure and
          # lengths only — never a value.
          python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get('COMPOSER_AUTH', '')
          print(f'COMPOSER_AUTH present: {bool(raw)}, length {len(raw)}')
          try:
              d = json.loads(raw)
          except Exception as e:
              print(f'::error::COMPOSER_AUTH is not valid JSON: {e.__class__.__name__}')
              sys.exit(1)
          for scheme, hosts in d.items():
              for host, value in hosts.items():
                  print(f'  {scheme} / {host}: {len(value)} characters')
          PY

          docker buildx bake --file docker-bake.hcl web \
            --set web.platform=linux/amd64 \
            --set web.cache-to= \
            --load
          docker image inspect ghcr.io/netresearch/typo3-demo:latest >/dev/null

      - name: Start services
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cp .env.example .env
          # Only on main is there something to pull. On a pull request the image
          # under test is already in the local store and `pull` would replace it
          # with main's — `compose up` still fetches db, valkey and caddy, which
          # it does not have.
          if [ "$EVENT_NAME" = "push" ]; then
            docker compose pull
          fi
          docker compose up -d --wait --timeout 300 || {
            echo "=== DB logs ==="
            docker compose logs db
            echo "=== Web logs ==="
            docker compose logs web
            echo "=== TYPO3 error log ==="
            docker compose exec -T web sh -c "cat var/log/typo3_*.log 2>/dev/null | tail -50" || true
            echo "=== HTTP response ==="
            docker compose exec -T web sh -c "curl -sL http://127.0.0.1/ 2>&1 | head -50" || true
            echo "=== Container status ==="
            docker compose ps -a
            exit 1
          }

      # Caddy terminates TLS with its own internal CA, so every check below would
      # otherwise have to pass `-k` and accept *any* certificate — which keeps a
      # broken TLS setup invisible. Export that CA once and pin it instead, and
      # confine both the request and any redirect to https (`githubactions:S6506`
      # on line 109 was about `-L` silently following a downgrade to http, not
      # about the certificate).
      - name: Export Caddy's local CA
        run: |
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          test -s "$RUNNER_TEMP/caddy-root.crt"

      # `grep -qi typo3` alone accepts the TYPO3 *exception* page, whose title
      # contains the word — so a site broken badly enough to throw on every
      # request passed this check and only surfaced later as a healthcheck
      # timeout with no message. A broken TypoScript meta tag did exactly that.
      - name: Verify TYPO3 responds
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost 2>/dev/null || true)
            if printf '%s' "$body" | grep -qiE '<title>[^<]*TYPO3 Exception'; then
              echo "ERROR: TYPO3 answers with an exception page."
              printf '%s' "$body" | grep -oiE '(exception|message)[^<]{0,200}' | head -5
              exit 1
            fi
            if printf '%s' "$body" | grep -qi "typo3"; then
              echo "TYPO3 is responding."
              exit 0
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done
          echo "ERROR: TYPO3 did not respond in time."
          docker compose logs web
          exit 1

      # The findability settings live in TypoScript and in nginx, and neither is
      # visible to any static check — a typo in a `page.meta` key or a broken
      # `location` block produces a page that still renders and quietly says
      # nothing about itself. Assert them on the real render.
      - name: Verify the page is indexable and describes itself
        run: |
          get() { curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "$1"; }
          html=$(get https://localhost)
          fail() { echo "ERROR: $1"; grep -oiE '<meta[^>]+(name|property)="(robots|description|og:[a-z:]+|twitter:[a-z]+|theme-color)"[^>]*>' <<<"$html" || echo '(no matching meta tags at all)'; exit 1; }

          # `grep … && fail …` would be wrong here: this step runs under bash -e,
          # and when the page is correct grep exits 1, the && list returns
          # non-zero, and the step dies at the exact moment it should pass.
          if grep -qiE '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' <<<"$html"; then
            fail 'the page still declares itself NOINDEX'
          fi

          for tag in 'name="description"' 'property="og:title"' 'property="og:description"' 'property="og:image"' 'property="og:site_name"' 'name="twitter:card"' 'name="theme-color"'; do
            grep -qiE "<meta[^>]+$tag" <<<"$html" || fail "missing meta tag: $tag"
          done

          # A description that is only the site name is what this replaced; it
          # must not come back through an empty fallback chain.
          desc=$(grep -oiE '<meta[^>]+name="description"[^>]*>' <<<"$html" | head -1)
          case "$desc" in *'content="Netresearch TYPO3 Demo"'*) fail "description fell back to the bare site name: $desc";; esac

          # og:image must be absolute — a relative value is silently useless.
          grep -oiE '<meta[^>]+property="og:image"[^>]*>' <<<"$html" | grep -q 'content="https\?://' \
            || fail 'og:image is not an absolute URL'

          # …and it must actually exist. An og:image 404 is invisible on the
          # page and only shows up as a blank card in somebody else's feed, so
          # the URL is followed rather than trusted. The size is checked too:
          # a preview wants 1.91:1, and the card is 1200x630.
          img=$(grep -oiE '<meta[^>]+property="og:image"[^>]*>' <<<"$html" | grep -oE 'content="[^"]+"' | head -1 | cut -d'"' -f2)
          echo "og:image -> $img"
          code=$(curl -s -o /tmp/og.bin -w '%{http_code}' --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "$img")
          [ "$code" = "200" ] || fail "og:image answered HTTP $code"
          python3 - <<'PY'
          import struct, sys
          d = open('/tmp/og.bin', 'rb').read()
          if d[:8] != b'\x89PNG\r\n\x1a\n':
              print('::error::og:image is not a PNG'); sys.exit(1)
          w, h = struct.unpack('>II', d[16:24])
          print(f'og:image is {w}x{h}, ratio {w/h:.3f}')
          if (w, h) != (1200, 630):
              print(f'::error::expected 1200x630, got {w}x{h}'); sys.exit(1)
          PY

          echo "Meta tags present and indexable."

      # The JSON-LD is assembled in TypoScript, where a stray quote or an
      # unreplaced placeholder produces a block that still *looks* present and
      # is silently worthless to every consumer. So parse it, rather than grep
      # for the script tag.
      - name: Verify the structured data parses
        run: |
          get() { curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "$1"; }
          get https://localhost > /tmp/home.html
          get https://localhost/extensions/browser-ai-form-assistant > /tmp/plugin.html
          python3 - <<'PY'
          import json, re, sys

          expected = {
              '/tmp/home.html':   {'WebSite', 'Organization'},
              '/tmp/plugin.html': {'SoftwareApplication', 'HowTo'},
          }
          failed = False
          for path, want in expected.items():
              html = open(path, encoding='utf-8', errors='replace').read()
              blocks = re.findall(
                  r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>', html, re.S)
              if not blocks:
                  print(f'::error::{path}: no JSON-LD block at all'); failed = True; continue
              seen = set()
              for i, raw in enumerate(blocks, 1):
                  if '###' in raw:
                      print(f'::error::{path} block {i}: an unreplaced ### placeholder survived')
                      failed = True
                  try:
                      data = json.loads(raw)
                  except Exception as e:
                      print(f'::error::{path} block {i}: invalid JSON — {e}')
                      print(raw[:400]); failed = True; continue
                  nodes = data.get('@graph') or [data]
                  for n in nodes:
                      seen.add(n.get('@type'))
                      for key in ('@id', 'url'):
                          v = n.get(key)
                          if isinstance(v, str) and v.startswith('/'):
                              print(f'::error::{path}: {n.get("@type")}.{key} is relative: {v}')
                              failed = True
              missing = want - seen
              print(f'{path}: {len(blocks)} block(s), types {sorted(t for t in seen if t)}')
              if missing:
                  print(f'::error::{path}: missing expected type(s) {sorted(missing)}')
                  failed = True
          sys.exit(1 if failed else 0)
          PY
          echo "Structured data parses and carries the expected types."

      - name: Verify robots.txt and llms.txt are served
        run: |
          for path in robots.txt llms.txt; do
            body=$(curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "https://localhost/$path") \
              || { echo "ERROR: /$path did not respond"; exit 1; }
            ctype=$(curl -sSfLI --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "https://localhost/$path" | grep -i '^content-type:')
            echo "/$path -> $ctype"
            case "$ctype" in *'text/plain'*) : ;; *) echo "ERROR: /$path is not text/plain"; exit 1;; esac
            printf '%s' "$body" | grep -q . || { echo "ERROR: /$path is empty"; exit 1; }
          done
          curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/robots.txt | grep -q '^Sitemap: https://' \
            || { echo 'ERROR: robots.txt names no sitemap'; exit 1; }
          echo "robots.txt and llms.txt served."

      # The seed carries no `pages` translation, which is exactly the state in
      # which the core language menu marks German unavailable and bootstrap_package
      # would render a dead span. The site runs fallbackType: fallback, so the link
      # is valid anyway and the site package overrides the partial to emit it. That
      # override is invisible to every static check, so assert it on a real render.
      - name: Verify the language switcher renders and links
        run: |
          html=$(curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost)
          # The whole <ul>, not a fixed number of lines after the wrapper div:
          # bootstrap_package's markup puts the German entry 17 lines below it,
          # so an -A8 window reported a missing link on markup that was correct.
          menu=$(printf '%s' "$html" | awk '/<ul id="language_menu"/,/<\/ul>/')
          fail() {
            echo "ERROR: $1"
            printf '%s' "$html" | grep -c 'footer-section-meta' | sed 's/^/footer-section-meta occurrences: /'
            if [ -n "$menu" ]; then
              echo '--- rendered language menu ---'
              printf '%s\n' "$menu"
            else
              echo '(no language_menu block in the response at all)'
            fi
            exit 1
          }
          [ -n "$menu" ] \
            || fail 'the language menu is not rendered (page.theme.language.enable?)'
          printf '%s' "$menu" | grep -q 'href="/de/"' \
            || fail 'the German entry renders without a link (partial override not in effect?)'
          echo "Language switcher renders and links to /de/."

      # The plugin's title sits inside the section "Try it" opens with an h2, so
      # it has to be an h3 — otherwise the outline says the two are siblings
      # when one contains the other. It only became settable in nr_browser_ai
      # 0.7.0, and the value lives in a FlexForm inside the seed, where nothing
      # else would notice it silently reverting to the h2 default.
      - name: Verify the form assistant title is nested correctly
        run: |
          html=$(curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" \
                 https://localhost/extensions/browser-ai-form-assistant)
          title=$(grep -oiE '<h[1-6][^>]*class="nr-browser-ai-form__title"[^>]*>' <<<"$html" | head -1)
          if [ -z "$title" ]; then
            echo "ERROR: the plugin rendered no title at all."
            grep -oiE '<h[1-6][^>]*>' <<<"$html" | head -10
            exit 1
          fi
          echo "rendered as: $title"
          case "$title" in
            '<h3'*) echo "Form assistant title is an h3, nested under its section." ;;
            *) echo "ERROR: expected an h3, got: $title"; exit 1 ;;
          esac

      # A skipped level (h2 straight to h4) leaves anyone navigating by heading
      # unable to tell whether what follows belongs to the section above it, and
      # it is invisible to everyone else — the page looks identical. Most of
      # these headings come from RTE bodytext in the seed, where no static check
      # sees them at all.
      - name: Verify no heading level is skipped
        run: |
          get() { curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "$1"; }
          get https://localhost/extensions/browser-ai-form-assistant > /tmp/outline.html
          get https://localhost > /tmp/outline-home.html
          python3 - <<'PY'
          import re, sys
          failed = False
          for path in ('/tmp/outline.html', '/tmp/outline-home.html'):
              html = open(path, encoding='utf-8', errors='replace').read()
              levels = [(int(m.group(1)), re.sub(r'<[^>]+>', '', m.group(2)).strip()[:40])
                        for m in re.finditer(r'<h([1-6])[^>]*>(.*?)</h\1>', html, re.S | re.I)]
              levels = [(n, t) for n, t in levels if t]
              print(f'{path}: {" ".join("h%d" % n for n, _ in levels)}')
              prev = None
              for n, text in levels:
                  if prev is not None and n > prev + 1:
                      print(f'::error::{path}: h{prev} jumps to h{n} at "{text}"')
                      failed = True
                  prev = n
              if levels and levels[0][0] != 1:
                  print(f'::error::{path}: first heading is h{levels[0][0]}, not h1')
                  failed = True
          sys.exit(1 if failed else 0)
          PY
          echo "Heading outline has no skipped level."

      # A TypoScript constant nobody defines does not fail — it passes through as
      # a plain string and lands in the markup. rte_ckeditor_image bridged
      # {$styles.content.image.lazyLoading}, which only EXT:fluid_styled_content
      # defines and this installation does not have, so RTE images rendered
      # loading="{$styles.content.image.lazyLoading}" until 13.10.2. The pattern
      # is deliberately {$name}, not ${name}: the latter is a JavaScript template
      # literal and legitimately appears in the page.
      - name: Verify no unresolved TypoScript constant reaches the markup
        run: |
          get() { curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "$1"; }
          failed=0

          # The page list comes from the running stack, not from this file. A
          # demo page added tomorrow is then covered without anyone remembering
          # to edit the workflow — which is how the two-URL version came to
          # prove almost nothing. Only pages a visitor can actually open:
          # rendered doktype, not deleted or hidden, live workspace, no access
          # group, inside its publication window.
          paths=$(docker compose exec -T db sh -c 'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -N -B -u "$MARIADB_USER" "$MARIADB_DATABASE"' <<'SQL'
          SELECT slug FROM pages
           WHERE deleted = 0 AND hidden = 0 AND doktype = 1 AND t3ver_wsid = 0
             AND (fe_group = '' OR fe_group = '0')
             AND (starttime = 0 OR starttime <= UNIX_TIMESTAMP())
             AND (endtime = 0 OR endtime > UNIX_TIMESTAMP())
             AND slug LIKE '/%'
           ORDER BY slug;
          SQL
          )
          count=$(printf '%s\n' "$paths" | grep -c . || true)
          if [ "${count:-0}" -lt 20 ]; then
            echo "::error::only $count page(s) came back — the query or the stack is wrong, and a near-empty sweep would pass by default"
            exit 1
          fi
          echo "Checking $count page(s) for unresolved constants."

          # Slugs come from our own seed, but the loop never lets one reach a
          # shell: read splits on newlines only, and the value is passed to
          # curl as a single argument.
          #
          # A 404 is not a failure here. Some pages in the tree are not
          # standalone — /blog/detail renders a single post and answers 404
          # without one — and that is a content fact, not a leaked constant.
          # They are reported so the number stays honest. Anything else,
          # including a 5xx or no answer at all, still fails: a page that
          # cannot be fetched is a page this check says nothing about.
          skipped=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            status=$(curl -so "$RUNNER_TEMP/page.html" -w '%{http_code}' \
              --proto '=https' --proto-redir '=https' \
              --cacert "$RUNNER_TEMP/caddy-root.crt" "https://localhost$path") || status=000
            case "$status" in
              2*) html=$(cat "$RUNNER_TEMP/page.html") ;;
              404) skipped=$((skipped + 1)); echo "$path: 404, not a standalone page — skipped"; continue ;;
              *)  echo "::error::$path answered $status — the check cannot say anything about it"
                  failed=1
                  continue ;;
            esac
            hits=$(printf '%s' "$html" | grep -oE '\{\$[A-Za-z_][A-Za-z0-9_.]*\}' | sort -u || true)
            if [ -n "$hits" ]; then
              echo "::error::$path emits unresolved TypoScript constants:"
              # shellcheck disable=SC2086  # unquoted on purpose: one printf argument per hit
              printf '  %s\n' $hits
              failed=1
            fi
          done <<EOF
          $paths
          EOF

          # Without an image on it the RTE page proves nothing, so assert the
          # subject of the check is actually present. Matched with `case` rather
          # than piped into grep: `grep -q` closes the pipe on its first match,
          # and whatever feeds it — curl, then printf — dies of EPIPE and prints
          # a write error into a step that passed.
          echo "Checked $((count - skipped)) page(s); $skipped skipped as non-standalone."
          if [ "$skipped" -gt $((count / 4)) ]; then
            echo "::error::$skipped of $count pages did not render — that is too many to call this a sweep"
            failed=1
          fi

          rte=$(get https://localhost/extensions/rte-ckeditor-image)
          case "$rte" in
            *"<img"*) : ;;
            *) echo '::error::the RTE demo page renders no <img> — this check would be vacuous'; failed=1 ;;
          esac
          exit $failed

      # Core's own image processing needs WebP and AVIF encoders, which is what
      # imageFileConversionFormats relies on. The image shipped GD without those
      # flags and never built imagick, so nothing produced a modern format. Real
      # bytes are asserted rather than capability flags: ImageMagick without a
      # working AVIF delegate writes an EMPTY .avif instead of failing.
      #
      # These assertions predate the removal of nr_image_optimize and are kept
      # deliberately: they are the condition under which the WebP delivery
      # asserted further down works at all.
      - name: Verify the image encoders are present
        run: |
          docker compose exec -T web php -r '
          $bad = [];

          if (!extension_loaded("gd")) {
              $bad[] = "the gd extension is not loaded";
          }
          if (!extension_loaded("imagick")) {
              $bad[] = "the imagick extension is not loaded";
          } else {
              $formats = Imagick::queryFormats();
              foreach (["WEBP", "AVIF"] as $fmt) {
                  if (!in_array($fmt, $formats, true)) {
                      $bad[] = "imagick reports no $fmt delegate";
                  }
              }
          }
          $gd = extension_loaded("gd") ? gd_info() : [];
          foreach (["WebP", "AVIF"] as $fmt) {
              if (empty($gd["$fmt Support"])) {
                  $bad[] = "GD was built without $fmt support";
              }
          }
          if (extension_loaded("gd")) {
              $img = imagecreatetruecolor(32, 32);
              imagefilledrectangle($img, 0, 0, 31, 31, imagecolorallocate($img, 200, 80, 40));
              foreach (["webp", "avif"] as $fmt) {
                  $fn = "image" . $fmt;
                  if (!function_exists($fn)) {
                      $bad[] = "GD does not provide $fn()";
                      continue;
                  }
                  $path = "/tmp/encodercheck." . $fmt;
                  @unlink($path);
                  @$fn($img, $path);
                  $size = is_file($path) ? filesize($path) : 0;
                  printf("  GD %-4s -> %d bytes\n", $fmt, $size);
                  if ($size < 24) {
                      $bad[] = "GD produced no usable $fmt output ($size bytes)";
                  }
              }
          }

          if ($bad !== []) {
              foreach ($bad as $m) {
                  fwrite(STDERR, "ERROR: " . $m . "\n");
              }
              exit(1);
          }
          echo "  imagick and GD both encode WebP and AVIF.\n";
          '

      # GFX.imageFileConversionFormats decides the target format of every
      # processed image. It is set in the entrypoint rather than in settings.php,
      # which is written on first boot only — so nothing in the repository shows
      # whether the running instance actually got it. Assert the rendered page.
      - name: Verify processed images are delivered as WebP
        run: |
          html=$(curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost)
          printf '%s' "$html" > /tmp/webp-check.html
          python3 - <<'PY'
          import re, sys
          html = open('/tmp/webp-check.html', encoding='utf-8', errors='replace').read()
          urls = {p.strip().split(' ')[0]
                  for m in re.finditer(r'(?:src|srcset)="([^"]+)"', html)
                  for p in m.group(1).split(',')}
          processed = sorted(u for u in urls if '_processed_' in u)
          # svg is exempt from the conversion on purpose: rasterising a vector
          # is a downgrade, so those keep their extension.
          offenders = [u for u in processed if not u.lower().endswith(('.webp', '.svg'))]
          print(f'processed images on the home page: {len(processed)}')
          if not processed:
              print('::error::no processed image on the home page — this check would be vacuous')
              sys.exit(1)
          for u in offenders[:10]:
              print(f'::error::processed image is not webp: {u}')
          sys.exit(1 if offenders else 0)
          PY
          echo "Processed images are WebP."

      - name: Cleanup
        if: always()
        run: docker compose down -v
