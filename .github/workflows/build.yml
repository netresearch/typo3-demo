name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required by the merge queue: `build` is a required check, and a required
  # check that never reports on a merge group is treated as failed once
  # check_response_timeout_minutes elapses, ejecting every queued entry.
  merge_group:
  # Manual re-trigger: rebuilds the image so dev-main VCS deps (e.g.
  # netresearch/nr-ai-search) are re-resolved without a code change on main.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: netresearch/.github/.github/workflows/build-container-bake.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      # Build the local LFS checkout (docker-bake.hcl target "web" has
      # context "."); push only on main. GIT_SHA feeds the HCL sha tag.
      # Trivy scan stays off to match the previous inline build.
      bake-source: .
      lfs: true
      # workflow_dispatch exists to rebuild and republish the image — without
      # push the manual rebuild produced an image that never left the runner.
      push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
      scan: false
      pre-build-command: echo "GIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      # NRS-4588 phase 1: merge the declared Composer SBOM (from the committed
      # composer.lock) with the Syft image scan and attach it to the digest as
      # a Cosign CycloneDX attestation. Only runs where push is true.
      sbom-attest: true
    secrets:
      # gitlab-token, not http-basic: GITLAB_COMPOSER_TOKEN is a project access
      # token, and GitLab's API only accepts those via the PRIVATE-TOKEN header
      # (basic auth answers 404) — gitlab-token makes Composer send exactly that.
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}, "gitlab-token": {"git.netresearch.de": "${{ secrets.GITLAB_COMPOSER_TOKEN }}"}}'

  # GitHub-issued SBOM attestation on top of the Cosign one, verifiable with
  # `gh attestation verify oci://<image>@<digest> --owner netresearch`. Separate
  # reusable because it needs `attestations: write`, which build-container-bake
  # deliberately does not require. Guarded by the same condition as the `push`
  # input above: without a pushed image there is no digest to attest, and the
  # reusable fails rather than no-ops.
  attest-sbom:
    needs: build
    # Same condition as the push input above — a dispatch rebuild pushes too.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: netresearch/.github/.github/workflows/attest-sbom.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      # subjects, not bake-metadata: GitHub masks the raw metadata output away
      # entirely when it matches a secret (tokens in build args), which
      # silently emptied the attest matrix (run 31057574829).
      subjects: ${{ needs.build.outputs.sbom-subjects }}

  # Runs on main *and* on pull requests, but gets its image from a different
  # place in each case. On main `build` has just published the image, so pulling
  # it validates the exact artifact the deploy will roll out. On a pull request
  # nothing is published — `build` sets `push` false there — so a `docker compose
  # pull` would fetch main's `:latest` and report on code the PR does not
  # contain. That is worse than not running, because it looks like a safeguard.
  # The pull-request path therefore builds the image here and loads it into the
  # local daemon under the tag compose.yml names.
  #
  # Forks are excluded: the build needs COMPOSER_AUTH for the private
  # git.netresearch.de VCS repository, and secrets are not exposed to them.
  validate:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      # The db service runs the MariaDB Docker Hardened Image; dhi.io serves no
      # anonymous pulls, so the stack cannot come up without this.
      - name: Log in to dhi.io
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: echo "$DHI_TOKEN" | docker login dhi.io -u "$DHI_USERNAME" --password-stdin

      # docker-container driver: the default docker driver cannot read the GHA
      # layer cache, and without that cache this rebuilds composer install and
      # the whole TYPO3 tree on every pull request.
      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Same bake target the published image comes from, so a change to the
      # build definition is exercised here too rather than only after a merge.
      # `--file docker-bake.hcl` is what makes that true rather than lucky: the
      # reusable passes the same file, and without it bake also merges
      # compose.yml, whose `web` service declares its own build context.
      # Overrides: one platform, because `--load` cannot take a multi-platform
      # result; and no cache export, because `build` already wrote the cache
      # this run reads and a second writer buys nothing.
      #
      # GIT_SHA stays unset, so the HCL emits exactly one tag,
      # ghcr.io/netresearch/typo3-demo:latest — the tag compose.yml resolves.
      - name: Build the image under test
        if: github.event_name == 'pull_request'
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}, "gitlab-token": {"git.netresearch.de": "${{ secrets.GITLAB_COMPOSER_TOKEN }}"}}'
        run: |
          # Pre-flight, because this step failed once with "Invalid credentials"
          # against git.netresearch.de while the `build` job resolved the very
          # same package from the very same URL in the same run. Structure and
          # lengths only — never a value.
          python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get('COMPOSER_AUTH', '')
          print(f'COMPOSER_AUTH present: {bool(raw)}, length {len(raw)}')
          try:
              d = json.loads(raw)
          except Exception as e:
              print(f'::error::COMPOSER_AUTH is not valid JSON: {e.__class__.__name__}')
              sys.exit(1)
          for scheme, hosts in d.items():
              for host, value in hosts.items():
                  print(f'  {scheme} / {host}: {len(value)} characters')
          PY

          docker buildx bake --file docker-bake.hcl web \
            --set web.platform=linux/amd64 \
            --set web.cache-to= \
            --load
          docker image inspect ghcr.io/netresearch/typo3-demo:latest >/dev/null

      - name: Start services
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cp .env.example .env
          # Only on main is there something to pull. On a pull request the image
          # under test is already in the local store and `pull` would replace it
          # with main's — `compose up` still fetches db, valkey and caddy, which
          # it does not have.
          if [ "$EVENT_NAME" = "push" ]; then
            docker compose pull
          fi
          docker compose up -d --wait --timeout 300 || {
            echo "=== DB logs ==="
            docker compose logs db
            echo "=== Web logs ==="
            docker compose logs web
            echo "=== TYPO3 error log ==="
            docker compose exec -T web sh -c "cat var/log/typo3_*.log 2>/dev/null | tail -50" || true
            echo "=== HTTP response ==="
            docker compose exec -T web sh -c "curl -sL http://127.0.0.1/ 2>&1 | head -50" || true
            echo "=== Container status ==="
            docker compose ps -a
            exit 1
          }

      # Caddy terminates TLS with its own internal CA, so every check below would
      # otherwise have to pass `-k` and accept *any* certificate — which keeps a
      # broken TLS setup invisible. Export that CA once and pin it instead, and
      # confine both the request and any redirect to https (`githubactions:S6506`
      # on line 109 was about `-L` silently following a downgrade to http, not
      # about the certificate).
      - name: Export Caddy's local CA
        run: |
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          test -s "$RUNNER_TEMP/caddy-root.crt"

      - name: Verify TYPO3 responds
        run: |
          for i in $(seq 1 30); do
            if curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost 2>/dev/null | grep -qi "typo3"; then
              echo "TYPO3 is responding."
              exit 0
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done
          echo "ERROR: TYPO3 did not respond in time."
          docker compose logs web
          exit 1

      # The findability settings live in TypoScript and in nginx, and neither is
      # visible to any static check — a typo in a `page.meta` key or a broken
      # `location` block produces a page that still renders and quietly says
      # nothing about itself. Assert them on the real render.
      - name: Verify the page is indexable and describes itself
        run: |
          get() { curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "$1"; }
          html=$(get https://localhost)
          fail() { echo "ERROR: $1"; printf '%s' "$html" | grep -oiE '<meta[^>]+(name|property)="(robots|description|og:[a-z:]+|twitter:[a-z]+|theme-color)"[^>]*>' || echo '(no matching meta tags at all)'; exit 1; }

          printf '%s' "$html" | grep -qiE '<meta[^>]+name="robots"[^>]+content="[^"]*noindex' \
            && fail 'the page still declares itself NOINDEX'

          for tag in 'name="description"' 'property="og:title"' 'property="og:description"' 'property="og:image"' 'property="og:site_name"' 'name="twitter:card"' 'name="theme-color"'; do
            printf '%s' "$html" | grep -qiE "<meta[^>]+$tag" || fail "missing meta tag: $tag"
          done

          # A description that is only the site name is what this replaced; it
          # must not come back through an empty fallback chain.
          desc=$(printf '%s' "$html" | grep -oiE '<meta[^>]+name="description"[^>]*>' | head -1)
          case "$desc" in *'content="Netresearch TYPO3 Demo"'*) fail "description fell back to the bare site name: $desc";; esac

          # og:image must be absolute — a relative value is silently useless.
          printf '%s' "$html" | grep -oiE '<meta[^>]+property="og:image"[^>]*>' | grep -q 'content="https\?://' \
            || fail 'og:image is not an absolute URL'

          echo "Meta tags present and indexable."

      - name: Verify robots.txt and llms.txt are served
        run: |
          for path in robots.txt llms.txt; do
            body=$(curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "https://localhost/$path") \
              || { echo "ERROR: /$path did not respond"; exit 1; }
            ctype=$(curl -sSfLI --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" "https://localhost/$path" | grep -i '^content-type:')
            echo "/$path -> $ctype"
            case "$ctype" in *'text/plain'*) : ;; *) echo "ERROR: /$path is not text/plain"; exit 1;; esac
            printf '%s' "$body" | grep -q . || { echo "ERROR: /$path is empty"; exit 1; }
          done
          curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/robots.txt | grep -q '^Sitemap: https://' \
            || { echo 'ERROR: robots.txt names no sitemap'; exit 1; }
          echo "robots.txt and llms.txt served."

      # The seed carries no `pages` translation, which is exactly the state in
      # which the core language menu marks German unavailable and bootstrap_package
      # would render a dead span. The site runs fallbackType: fallback, so the link
      # is valid anyway and the site package overrides the partial to emit it. That
      # override is invisible to every static check, so assert it on a real render.
      - name: Verify the language switcher renders and links
        run: |
          html=$(curl -sSfL --proto '=https' --proto-redir '=https' --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost)
          # The whole <ul>, not a fixed number of lines after the wrapper div:
          # bootstrap_package's markup puts the German entry 17 lines below it,
          # so an -A8 window reported a missing link on markup that was correct.
          menu=$(printf '%s' "$html" | awk '/<ul id="language_menu"/,/<\/ul>/')
          fail() {
            echo "ERROR: $1"
            printf '%s' "$html" | grep -c 'footer-section-meta' | sed 's/^/footer-section-meta occurrences: /'
            if [ -n "$menu" ]; then
              echo '--- rendered language menu ---'
              printf '%s\n' "$menu"
            else
              echo '(no language_menu block in the response at all)'
            fi
            exit 1
          }
          [ -n "$menu" ] \
            || fail 'the language menu is not rendered (page.theme.language.enable?)'
          printf '%s' "$menu" | grep -q 'href="/de/"' \
            || fail 'the German entry renders without a link (partial override not in effect?)'
          echo "Language switcher renders and links to /de/."

      - name: Cleanup
        if: always()
        run: docker compose down -v
