name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required by the merge queue: `build` is a required check, and a required
  # check that never reports on a merge group is treated as failed once
  # check_response_timeout_minutes elapses, ejecting every queued entry.
  merge_group:
  # Manual re-trigger: rebuilds the image so dev-main VCS deps (e.g.
  # netresearch/nr-ai-search) are re-resolved without a code change on main.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          GIT_SHA: ${{ github.sha }}
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}, "http-basic": {"git.netresearch.de": {"username": "oauth2", "password": "${{ secrets.GITLAB_COMPOSER_TOKEN }}"}}}'
        with:
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  validate:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Start services
        run: |
          cp .env.example .env
          docker compose pull
          docker compose up -d --wait --timeout 300 || {
            echo "=== DB logs ==="
            docker compose logs db
            echo "=== Web logs ==="
            docker compose logs web
            echo "=== TYPO3 error log ==="
            docker compose exec -T web sh -c "cat var/log/typo3_*.log 2>/dev/null | tail -50" || true
            echo "=== HTTP response ==="
            docker compose exec -T web sh -c "curl -sL http://127.0.0.1/ 2>&1 | head -50" || true
            echo "=== Container status ==="
            docker compose ps -a
            exit 1
          }

      - name: Verify TYPO3 responds
        run: |
          for i in $(seq 1 30); do
            if curl -sSfkL https://localhost 2>/dev/null | grep -qi "typo3"; then
              echo "TYPO3 is responding."
              exit 0
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done
          echo "ERROR: TYPO3 did not respond in time."
          docker compose logs web
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down -v
