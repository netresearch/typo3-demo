    alt: Ältere Menschen sitzen bei Kaffee in einem Seniorentreff zusammen
  - id: familie-familienpass
    target: { page: /leben-in-falkenquell/familie-bildung-soziales, element: Angebote, item: Familienpass }
    motif: Familie am Eingang eines Freibads
    prompt: Family with two children arriving at the entrance of an outdoor natural swimming pool on a sunny day, towels under their arms.
    alt: Familie mit Kindern am Eingang eines Naturbads
  - id: familie-beratung
    target: { page: /leben-in-falkenquell/familie-bildung-soziales, element: Angebote, item: Soziale Beratung }
    motif: Beratungsgespräch in einem hellen Büro
    prompt: Counselling conversation between a social worker and a woman at a small round table in a bright office, documents on the table, calm and respectful.
    alt: Beratungsgespräch an einem Tisch in einem hellen Büro

