# Image plan for the Falkenquell site (NRMARKETING-1485).
#
# One entry per image slot. Targets name the page by its path and the content
# element by its header, not by uid: the uids change when the records move into
# the seed band. A generator script reads this file, sends `style.prompt` plus
# the entry's `prompt` to the image model, stores the result under
# fileadmin/falkenquell/bilder/<id>.jpg and attaches it with `alt` as
# alternative text. Entries with `reuse` attach the image of another entry.
#
# Source of the style: "Design-Briefing Stadt Falkenquell", section 06 Bildstil.

style:
  format: landscape 3:2, 1536x1024
  prompt: >-
    Editorial photograph of a modern mid-sized German town, natural daylight,
    bright and friendly colours, realistic everyday scene, people interacting
    naturally rather than posing, clean modern composition, calm eye-level
    perspective, slightly warm but neutral colour balance, no strong filters,
    no HDR look, no oversaturated colours, no cinematic drama, not stock-photo
    styled. No readable text, no signs with names, no logos, no recognisable
    real landmarks or real brands.

images:
  # Start page
  - id: start-thema-gruen
    target: { page: /, element: Aktuelle Themen, item: Falkenquell wird grün }
    motif: Junge Straßenbäume in einer Innenstadtstraße, frisch gepflanzt
    prompt: Freshly planted young street trees with tree guards along a renovated inner-city street, wide pavement, a few people walking by.
    alt: Frisch gepflanzte junge Bäume an einer Innenstadtstraße
  - id: start-thema-stadtfest
    target: { page: /, element: Aktuelle Themen, item: Stadtfest 2027 }
    motif: Stadtfest auf dem Marktplatz am frühen Abend
    prompt: Town festival on a historic market square in early evening light, small stage with a band in the background, families and friends standing and talking, string lights above.
    alt: Stadtfest auf dem Marktplatz mit Bühne und vielen Menschen
  - id: start-thema-willkommen
    target: { page: /, element: Aktuelle Themen, item: "Neu in Falkenquell?" }
    motif: Familie mit Umzugskartons vor einem Wohnhaus
    prompt: Young family carrying moving boxes into a modern apartment building with balconies, a child holding a small plant, friendly atmosphere.
    alt: Familie trägt Umzugskartons in ein Wohnhaus

  # Familie, Bildung & Soziales
  - id: familie-intro
    target: { page: /leben-in-falkenquell/familie-bildung-soziales, element: "Familie, Bildung & Soziales" }
    motif: Eltern mit Kindern auf einem Spielplatz im Park
    prompt: Parents with two children on a modern playground in a green park, children climbing, parents chatting on a bench.
    alt: Eltern und Kinder auf einem Spielplatz im Park
  - id: familie-kitas
    target: { page: /leben-in-falkenquell/familie-bildung-soziales, element: Angebote, item: Kitas }
    motif: Kinder malen in einer hellen Kita
    prompt: Small children painting at a low table in a bright daycare room, an educator kneeling beside them, colourful but tidy room.
    alt: Kinder malen gemeinsam mit einer Erzieherin in einer Kita
  - id: familie-schulen
    target: { page: /leben-in-falkenquell/familie-bildung-soziales, element: Angebote, item: Schulen }
    motif: Schulhof einer modernen Grundschule
    prompt: Schoolyard of a modern primary school with children playing during break, school building with large windows in the background.
    alt: Kinder spielen auf dem Schulhof einer Grundschule
  - id: familie-jugend
    target: { page: /leben-in-falkenquell/familie-bildung-soziales, element: Angebote, item: Jugend & Freizeit }
    motif: Jugendliche im Jugendtreff
    prompt: Group of teenagers in a youth centre, playing table football and talking, relaxed atmosphere, simple modern interior.
    alt: Jugendliche spielen Tischkicker in einem Jugendtreff
  - id: familie-senioren
    target: { page: /leben-in-falkenquell/familie-bildung-soziales, element: Angebote, item: Seniorinnen und Senioren }
    motif: Ältere Menschen beim gemeinsamen Kaffee im Seniorentreff
