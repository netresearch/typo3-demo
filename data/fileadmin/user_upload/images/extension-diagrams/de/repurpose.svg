<title id="t">Eine Seite, viele Kanäle</title>
<desc id="d">Eine vorhandene Seite ist die Quelle: die Erweiterung leitet daraus über NR LLM Social-Texte, Zusammenfassungen und alternative Formulierungen ab, ohne den Inhalt neu zu erfassen.</desc>
