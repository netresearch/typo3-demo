<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Ein Satz füllt ein Formular mit siebzig Feldern</title>
<desc id="d">Die Formulardefinition selbst wird zum Werkzeugvertrag: ihre Validatoren, Optionen und Beschreibungen werden zu einem Schema, das Modell auf dem Gerät erzeugt dazu passende Argumente, und das ausgefüllte Formular läuft.</desc>
<defs>
<marker id="head-585961" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#585961" /></marker>
<marker id="head-2F99A4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F99A4" /></marker>
<marker id="head-FF4D00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D00" /></marker>
</defs>
<rect width="1200" height="520" fill="#FFFFFF" />
<text x="60" y="58" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#585961" text-anchor="start">Die Formulardefinition ist der Werkzeugvertrag</text>
<rect x="50" y="100" width="240" height="120" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="170.0" y="134" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Ein Satz</text>
<text x="170.0" y="166" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">„Windböen in Innsbruck</text>
<text x="170.0" y="187" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">für zehn Tage“</text>
<line x1="300" y1="160" x2="360" y2="160" stroke="#585961" stroke-width="2" marker-end="url(#head-585961)" />
<rect x="370" y="100" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="495.0" y="134" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Schema aus dem</text>
<text x="495.0" y="158" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Formular</text>
<text x="495.0" y="190" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">Validatoren · Optionen ·</text>
<text x="495.0" y="211" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">Beschriftungen</text>
<line x1="630" y1="160" x2="690" y2="160" stroke="#585961" stroke-width="2" marker-end="url(#head-585961)" />
<rect x="700" y="100" width="230" height="120" rx="10" fill="#2F99A4" stroke="#2F99A4" stroke-width="1.5" />
<text x="815.0" y="134" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Modell auf dem</text>
<text x="815.0" y="159" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Gerät</text>
<text x="815.0" y="192" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">erzeugt Argumente</text>
<line x1="940" y1="160" x2="1000" y2="160" stroke="#585961" stroke-width="2" marker-end="url(#head-585961)" />
<rect x="1010" y="100" width="140" height="120" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="1080.0" y="134" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Geprüft</text>
<text x="1080.0" y="166" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">Enum-Werte</text>
<text x="1080.0" y="187" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">kontrolliert</text>
<line x1="1080" y1="230" x2="1080" y2="290" stroke="#585961" stroke-width="2" marker-end="url(#head-585961)" />
<rect x="700" y="300" width="450" height="110" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="925.0" y="334" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Das Formular füllt sich selbst aus</text>
<text x="925.0" y="358" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">und läuft</text>
<text x="925.0" y="390" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">siebzig Felder · eine MultiCheckbox ist eine</text>
<text x="925.0" y="411" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">Array-Eigenschaft</text>
<line x1="690" y1="355" x2="500" y2="355" stroke="#2F99A4" stroke-width="2" marker-end="url(#head-2F99A4)" />
<text x="595.0" y="343.0" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" fill="#2F99A4" text-anchor="middle">Ergebnis</text>
<rect x="150" y="300" width="330" height="110" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="315.0" y="334" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Antwort mit den Daten</text>
<text x="315.0" y="366" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">als Textknoten gerendert</text>
<text x="50" y="470" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#FF4D00" text-anchor="start">Kein Server-Endpunkt: die Abfrage läuft aus der Seite selbst.</text>
</svg>
