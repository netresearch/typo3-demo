<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Wie der KI-Chat-Agent antwortet</title>
<desc id="d">Eine im TYPO3-Backend gestellte Frage geht an den Chat-Agenten. Der ruft MCP-Werkzeuge gegen Seiten, Datensätze, Backend-Benutzer, Logs und Site-Konfiguration auf und antwortet aus dem, was diese Werkzeuge geliefert haben.</desc>
<defs>
<marker id="head-585961" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#585961" /></marker>
<marker id="head-2F99A4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F99A4" /></marker>
<marker id="head-FF4D00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D00" /></marker>
</defs>
<rect width="1200" height="520" fill="#FFFFFF" />
<text x="60" y="60" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#585961" text-anchor="start">Jede Antwort stützt sich auf das, was die Werkzeuge geliefert haben</text>
<rect x="60" y="100" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="185.0" y="134" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Frage im Backend</text>
<text x="185.0" y="166" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">„Welche Seiten haben sich</text>
<text x="185.0" y="187" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">heute geändert?“</text>
<line x1="320" y1="155" x2="400" y2="155" stroke="#585961" stroke-width="2" marker-end="url(#head-585961)" />
<rect x="410" y="100" width="220" height="110" rx="10" fill="#2F99A4" stroke="#2F99A4" stroke-width="1.5" />
<text x="520.0" y="134" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">KI-Chat-Agent</text>
<text x="520.0" y="167" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">auf Basis von NR LLM</text>
<line x1="640" y1="155" x2="720" y2="155" stroke="#585961" stroke-width="2" marker-end="url(#head-585961)" />
<text x="680.0" y="143.0" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" fill="#585961" text-anchor="middle">ruft auf</text>
<rect x="730" y="100" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="845.0" y="134" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">MCP-Werkzeuge</text>
<text x="845.0" y="166" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">lesen und handeln</text>
<line x1="845" y1="220" x2="845" y2="290" stroke="#585961" stroke-width="2" marker-end="url(#head-585961)" />
<rect x="620" y="300" width="460" height="160" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="850.0" y="334" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">TYPO3-Installation</text>
<text x="850.0" y="366" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">Seiten · Inhalte · Datensätze · Backend-Benutzer ·</text>
<text x="850.0" y="387" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">Logs · Site-Konfiguration</text>
<line x1="620" y1="380" x2="350" y2="380" stroke="#2F99A4" stroke-width="2" marker-end="url(#head-2F99A4)" />
<text x="485.0" y="368.0" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" fill="#2F99A4" text-anchor="middle">was die Werkzeuge tatsächlich lieferten</text>
<rect x="60" y="320" width="270" height="120" rx="10" fill="#FFFFFF" stroke="#2F99A4" stroke-width="1.5" />
<text x="195.0" y="354" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Antwort</text>
<text x="195.0" y="386" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">keine erfundenen Fakten</text>
<text x="60" y="490" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#FF4D00" text-anchor="start">Ein Werkzeugaufruf kann Inhalte auch ändern — der Agent liest und handelt.</text>
</svg>
