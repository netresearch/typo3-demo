<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">One page tree, many channels</title>
<desc id="d">A context is defined by domain, GET parameter, IP range, HTTP header, session value or a combination of those. Pages, menu entries and single content elements are switched on or off per context.</desc>
<defs>
<marker id="head-585961" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#585961" /></marker>
<marker id="head-2F99A4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F99A4" /></marker>
<marker id="head-FF4D00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D00" /></marker>
</defs>
<rect width="1200" height="520" fill="#FFFFFF" />
<text x="60" y="58" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#585961" text-anchor="start">One page tree instead of one tree per channel</text>
<rect x="50" y="100" width="300" height="330" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="200.0" y="134" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">One page tree</text>
<text x="200.0" y="166" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">pages · menu entries · single</text>
<text x="200.0" y="187" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">content elements</text>
<line x1="360" y1="265" x2="430" y2="265" stroke="#585961" stroke-width="2" marker-end="url(#head-585961)" />
<rect x="440" y="150" width="300" height="230" rx="10" fill="#2F99A4" stroke="#2F99A4" stroke-width="1.5" />
<text x="590.0" y="184" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Context matches?</text>
<text x="590.0" y="217" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">domain · GET parameter · IP</text>
<text x="590.0" y="238" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">range · HTTP header · session</text>
<text x="590.0" y="259" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">value, or an AND / OR / XOR</text>
<text x="590.0" y="280" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">combination of them</text>
<line x1="750" y1="205" x2="830" y2="175" stroke="#2F99A4" stroke-width="2" marker-end="url(#head-2F99A4)" />
<text x="790.0" y="178.0" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" fill="#2F99A4" text-anchor="middle">yes</text>
<line x1="750" y1="325" x2="830" y2="355" stroke="#585961" stroke-width="2" marker-end="url(#head-585961)" />
<text x="790.0" y="364.0" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" fill="#585961" text-anchor="middle">no</text>
<rect x="840" y="120" width="310" height="110" rx="10" fill="#FFFFFF" stroke="#2F99A4" stroke-width="1.5" />
<text x="995.0" y="182.0" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Shown in this channel</text>
<rect x="840" y="300" width="310" height="110" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="995.0" y="362.0" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Hidden in this channel</text>
<text x="50" y="470" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#FF4D00" text-anchor="start">Editors mark where something appears — no parallel tree to keep in sync.</text>
</svg>
