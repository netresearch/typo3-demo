<rect x="760" y="100" width="390" height="90" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="955.0" y="134" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Social posts</text>
<text x="955.0" y="166" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">short copy per channel</text>
