<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">One page, many channels</title>
<desc id="d">An existing page is the source: the extension derives social copy, summaries and alternative phrasings from it through NR LLM, without re-entering the content by hand.</desc>
