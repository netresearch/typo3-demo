<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Cache that follows starttime and endtime</title>
<desc id="d">Content with a visibility window stayed cached beyond it (TYPO3 Forge #14277). The cache is now invalidated exactly when content becomes visible and again when it expires.</desc>
<defs>
<marker id="head-585961" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#585961" /></marker>
<marker id="head-2F99A4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F99A4" /></marker>
<marker id="head-FF4D00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D00" /></marker>
</defs>
<rect width="1200" height="520" fill="#FFFFFF" />
<text x="60" y="58" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#585961" text-anchor="start">TYPO3 Forge #14277: timed content stayed cached past its window</text>
<line x1="80" y1="250" x2="1120" y2="250" stroke="#CCCDCC" stroke-width="3" />
<rect x="380" y="215" width="420" height="70" rx="8" fill="#2F99A4" opacity="0.16" />
<text x="590" y="205" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#15585E" text-anchor="middle">content is visible</text>
<line x1="380" y1="180" x2="380" y2="320" stroke="#FF4D00" stroke-width="3" />
<line x1="800" y1="180" x2="800" y2="320" stroke="#FF4D00" stroke-width="3" />
<text x="380" y="170" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#FF4D00" text-anchor="middle">starttime</text>
<text x="800" y="170" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#FF4D00" text-anchor="middle">endtime</text>
<text x="380" y="345" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" font-weight="400" fill="#FF4D00" text-anchor="middle">cache cleared</text>
<text x="800" y="345" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="14" font-weight="400" fill="#FF4D00" text-anchor="middle">cache cleared</text>
<text x="215" y="300" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#585961" text-anchor="middle">not yet shown</text>
<text x="960" y="300" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#585961" text-anchor="middle">no longer shown</text>
<rect x="80" y="380" width="480" height="110" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="320.0" y="414" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">Scoping</text>
<text x="320.0" y="446" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">a single page, a page tree, or every page</text>
<rect x="620" y="380" width="500" height="110" rx="10" fill="#FFFFFF" stroke="#CCCDCC" stroke-width="1.5" />
<text x="870.0" y="414" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" font-weight="700" fill="#585961" text-anchor="middle">When</text>
<text x="870.0" y="446" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" fill="#585961" text-anchor="middle">on demand, or on a Scheduler run</text>
<text x="80" y="130" font-family="'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#585961" text-anchor="start">Works with any content type that uses starttime and endtime.</text>
</svg>
