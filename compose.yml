name: typo3-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ghcr.io/netresearch/typo3-demo:${TYPO3_DEMO_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      # The application user does not exist until db-init has run.
      db-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
      TYPO3_ENCRYPTION_KEY: ${TYPO3_ENCRYPTION_KEY:-}
      TYPO3_INSTALL_TOOL_PASSWORD: ${TYPO3_INSTALL_TOOL_PASSWORD:-joh316}
      # ai_filemetadata reads a plain OpenAI key from its own extension
      # configuration and has no nr_vault support, so it cannot use the vault
      # route the LLM modules take. The entrypoint writes it into
      # config/system/settings.php - which is the file the extension actually
      # reads; additional.php is not on its lookup path. Empty here keeps the
      # key already stored there.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # autotranslate reads its DeepL key from the extension configuration and has
      # no nr_vault support, so it cannot take the route OPENAI_API_KEY takes. The
      # entrypoint writes it into config/system/additional.php, which lives in the
      # typo3-config volume the worker mounts too — so only this service needs the
      # variable. Empty keeps a previously stored key instead of wiping it.
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    volumes:
      - typo3-fileadmin:/var/www/public/fileadmin
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"Host: $${TYPO3_DOMAIN:-localhost}\" http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  # Symfony Messenger consumer for nr-repurpose's async generation jobs
  # (doctrine transport). Reuses the web image; the web service has already
  # run the entrypoint setup by the time this starts. The consumer exits
  # after its time/memory limits and on fatal errors — the restart policy
  # recycles it either way, with Docker-visible backoff on crash loops.
  worker:
    image: ghcr.io/netresearch/typo3-demo:${TYPO3_DEMO_IMAGE_TAG:-latest}
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    # www-data so generated artifacts (podcasts, PNGs) on the shared
    # fileadmin/var volumes stay manageable by the web container's php-fpm.
    user: www-data
    entrypoint: ["sh", "-c"]
    command:
      # Consume three transports so content is both INDEXED and VECTORIZED:
      #   doctrine     - nr-repurpose async generation jobs
      #   index        - lochmueller/index page-index jobs; processing these emits
      #                  the IndexPageEvent that nr_ai_search turns into embed jobs
      #                  (without this the 'index' queue piles up and NOTHING is
      #                  ever vectorized — the RAG store stays empty)
      #   nr_ai_search - RAG embedding jobs, written to the shared var/ vektor store
      - >
        exec vendor/bin/typo3 messenger:consume doctrine index nr_ai_search
        --time-limit=3600 --memory-limit=512M --sleep=2
    environment:
      # Writable HOME for chromium (www-data has no home dir in the image);
      # /tmp keeps browser cache litter off the persistent var volume.
      HOME: /tmp
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
    volumes:
      - typo3-fileadmin:/var/www/public/fileadmin
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    # Override the web image's baked-in nginx HEALTHCHECK (the worker runs no
    # nginx) with a consumer-process check. `disable: true` is not enough:
    # `up --wait` errors on services with no healthcheck configured.
    healthcheck:
      # [m] bracket trick: keeps the healthcheck shell's own cmdline from
      # matching, which would report healthy even with a dead consumer.
      test: ["CMD-SHELL", "pgrep -f '[m]essenger:consume' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  # Periodic housekeeping for the AI Chat (nr_mcp_agent). `ai-chat:cleanup`
  # sets conversations stuck in processing/locked/tool_loop for more than five
  # minutes to failed, so the chat offers Retry instead of spinning forever,
  # and archives idle conversations after the extension's autoArchiveDays.
  # --delete-after-days=0 keeps archived conversations: the demo's chat history
  # is the input of the usage analysis. The stack has no cron and no scheduler
  # task, so a loop runs the command every 15 minutes. Each run is killed after
  # ten minutes, so a blocked database call cannot stop all later runs.
  chat-cleanup:
    image: ghcr.io/netresearch/typo3-demo:${TYPO3_DEMO_IMAGE_TAG:-latest}
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    user: www-data
    entrypoint: ["sh", "-c"]
    command:
      - >
        while true;
        do if timeout -k 30 600 vendor/bin/typo3 ai-chat:cleanup --delete-after-days=0;
        then touch /tmp/chat-cleanup.ok;
        else echo "ai-chat:cleanup failed with exit $$?";
        fi;
        sleep 900;
        done
    environment:
      HOME: /tmp
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
    volumes:
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    # Replaces the web image's nginx HEALTHCHECK; `up --wait` needs one.
    # Healthy while the last successful run is younger than 20 minutes, so a
    # command that keeps failing turns the service unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/chat-cleanup.ok) )) -lt 1200"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  # Runs the AI Chat's turns. A booted process waits for a turn, runs it and
  # ends, and the loop starts the next one, so the reader does not wait for TYPO3
  # to boot and nothing of a turn reaches the next (nr_mcp_agent ADR-029). Two
  # replicas: one runs a turn while the other waits. A turn that finds no free
  # worker starts a process of its own in the web container, so this service
  # being down costs a boot and nothing else. A deploy lets a running turn finish
  # within stop_grace_period.
  chat-worker:
    image: ghcr.io/netresearch/typo3-demo:${TYPO3_DEMO_IMAGE_TAG:-latest}
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    user: www-data
    entrypoint: ["sh", "-c"]
    command:
      - >
        while true;
        do vendor/bin/typo3 ai-chat:worker --poll-interval=100 --max-turns=1 --time-limit=3600 --turn-limit=600 &
        pid=$$!;
        trap 'kill -TERM $$pid; wait $$pid; exit 0' TERM INT;
        wait $$pid || sleep 2;
        done
    # Above --turn-limit: a deployment waits for a running turn rather than kill it.
    stop_grace_period: 610s
    environment:
      HOME: /tmp
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
    volumes:
      - typo3-fileadmin:/var/www/public/fileadmin
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    # Replaces the web image's nginx HEALTHCHECK; `up --wait` needs one. Anchored
    # on php, because the shell loop above carries the command in its own line.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '^[^ ]*php[^ ]* [^ ]*typo3 ai-chat:worker' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  # Sends the approved social posts whose time has come (nr_repurpose). Without
  # socialWebhookUrl in the extension configuration it only logs how many are due.
  social-publish:
    image: ghcr.io/netresearch/typo3-demo:${TYPO3_DEMO_IMAGE_TAG:-latest}
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    user: www-data
    entrypoint: ["sh", "-c"]
    command:
      - >
        while true;
        do if timeout -k 30 240 vendor/bin/typo3 nr_repurpose:publish-due;
        then touch /tmp/social-publish.ok;
        else echo "nr_repurpose:publish-due failed with exit $$?";
        fi;
        sleep 300;
        done
    environment:
      HOME: /tmp
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
    volumes:
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    # Replaces the web image's nginx HEALTHCHECK; `up --wait` needs one.
    # Healthy while the last successful run is younger than 10 minutes, so a
    # command that keeps failing turns the service unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/social-publish.ok) )) -lt 600"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  # Compacts nr_ai_search's vector store once a day. Every re-index appends a
  # new row per chunk and only soft-deletes the old one, so the store grows by
  # a full corpus generation per run: Reports > Status measured 4209 physical
  # rows for 102 live chunks ("Compaction overdue"). nr_ai_search ships a
  # Scheduler task for this, but this stack runs no scheduler, so the CLI
  # command runs in a loop like chat-cleanup above. Compaction holds the
  # store's exclusive lock and blocks searches while it runs; at the demo's
  # size that is seconds. The first run starts after every deploy. After a
  # host reboot Docker restarts this container without waiting for web, so a
  # failed run retries after five minutes instead of a day.
  vector-compact:
    image: ghcr.io/netresearch/typo3-demo:${TYPO3_DEMO_IMAGE_TAG:-latest}
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    user: www-data
    entrypoint: ["sh", "-c"]
    command:
      - >
        while true;
        do if timeout -k 30 1800 vendor/bin/typo3 nr-ai-search:vektor:compact;
        then touch /tmp/vector-compact.ok; sleep 86400;
        else echo "nr-ai-search:vektor:compact failed with exit $$?"; sleep 300;
        fi;
        done
    environment:
      HOME: /tmp
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
    volumes:
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    # Healthy while the last successful run is younger than 25 hours: one day
    # of sleep plus the run itself, so a compaction that keeps failing turns
    # the service unhealthy on the following day.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/vector-compact.ok) )) -lt 90000"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  # Executes the agent runs nr_llm has queued. nr_llm 0.42 stores a background
  # run and leaves it there: without a sweep it stays queued for ever, and the
  # stack has no scheduler, so a loop runs the sweep once a minute. A run that
  # started finishes after --time-limit, so `timeout` is well above it. The reaper
  # hands back a run whose worker was killed, which is what a deploy does to a
  # container in the middle of a run. These commands read the provider key as be_user 994
  # (worker.technicalBeUserUid, written by entrypoint.sh). fileadmin is mounted
  # because a vision run reads and scales the image here.
  llm-agent-worker:
    image: ghcr.io/netresearch/typo3-demo:${TYPO3_DEMO_IMAGE_TAG:-latest}
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    user: www-data
    entrypoint: ["sh", "-c"]
    command:
      - >
        while true;
        do rc=0;
        timeout -k 30 600 vendor/bin/typo3 nrllm:agent:work --limit=20 --time-limit=240 || rc=$$?;
        timeout -k 30 120 vendor/bin/typo3 nrllm:agent:reap --limit=50 || rc=$$?;
        if [ "$$rc" -eq 0 ];
        then touch /tmp/llm-agent-worker.ok;
        else echo "nrllm:agent:work or nrllm:agent:reap failed with exit $$rc";
        fi;
        sleep 60;
        done
    environment:
      HOME: /tmp
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
    volumes:
      - typo3-fileadmin:/var/www/public/fileadmin
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    # Healthy while the last successful tick is younger than 20 minutes: the two
    # commands take at most twelve, so a sweep that keeps failing turns the
    # service unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/llm-agent-worker.ok) )) -lt 1200"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  # Queues alternative texts for the images of one folder from what each image
  # shows (nr_llm 0.42). Each file without a text becomes a run that stops at its
  # approval card; nothing is written before somebody approves. A file with an
  # open or decided card or with a text is skipped, so a repeat costs nothing and
  # the folder of five images can never show more than five cards. The folder and
  # the user are seeded in data/seed-extensions.sql; on the first deploy they
  # do not exist yet when this starts, so a failed run retries after five minutes.
  # The stack has no scheduler, so a loop runs the command once a day and after
  # every deploy, the way vector-compact does.
  alt-text-batch:
    image: ghcr.io/netresearch/typo3-demo:${TYPO3_DEMO_IMAGE_TAG:-latest}
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    user: www-data
    entrypoint: ["sh", "-c"]
    command:
      # Backdating the file gives a fresh container one hour to succeed. `up
      # --wait` would otherwise wait for a command that can only succeed once the
      # seed has run, and the seed runs after `up`.
      - >
        touch -d "@$$(( $$(date +%s) - 86400 ))" /tmp/alt-text-batch.ok;
        while true;
        do if timeout -k 30 300 vendor/bin/typo3 nrllm:editor-action:batch set_file_alternative_text
        --user=nr_llm_worker --folder=1:/introduction/images/unsplash/;
        then touch /tmp/alt-text-batch.ok; sleep 86400;
        else echo "nrllm:editor-action:batch failed with exit $$?"; sleep 300;
        fi;
        done
    environment:
      HOME: /tmp
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
    volumes:
      - typo3-fileadmin:/var/www/public/fileadmin
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    # Healthy while the last successful run is younger than 25 hours, so a batch
    # that keeps failing turns the service unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/alt-text-batch.ok) )) -lt 90000"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  # MariaDB as a Docker Hardened Image: minimal debian-13 base, no package
  # manager and no shell tooling beyond what the server itself needs. Pulling it
  # requires a Docker Hub account with DHI entitlement (`docker login dhi.io`) —
  # dhi.io refuses anonymous pulls.
  #
  # Deliberately a floating tag where every other service here is digest-pinned:
  # Renovate has no dhi.io credentials, so a digest would never be bumped and
  # this stack would run a frozen "hardened" image — the opposite of the point.
  # `make update` pulls on every deploy, so the tag stays current by itself.
  #
  # Two consequences of the hardened entrypoint, both handled here rather than
  # by swapping the image out for a patched one:
  #   * it honours MARIADB_ROOT_PASSWORD and nothing else — no MARIADB_DATABASE
  #     /MARIADB_USER, no /docker-entrypoint-initdb.d. Database, application user
  #     and seed import live in the `db-init` service below.
  #   * it ships no configuration file, so the server falls back to its built-in
  #     collation, and its entrypoint execs a fixed `mariadbd --datadir=...`
  #     that drops any command arguments. docker/db/my.cnf is mounted to the one
  #     path the server still reads on its own.
  db:
    image: dhi.io/mariadb:12
    logging: *default-logging
    environment:
      # Only MARIADB_ROOT_PASSWORD reaches the hardened entrypoint. The other
      # three are ignored by it — db-init acts on them — but they stay declared
      # here because `docker compose exec db` is how this repo opens a client
      # (make db-shell, make export-seed, the diagnostics and BE-reset
      # workflows) and those read the credentials from this environment.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
    volumes:
      - typo3-db-v2:/var/lib/mysql
      - ./docker/db/my.cnf:/etc/my.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  # What the hardened image's entrypoint does not do: create the application
  # database and user, and import data/db.sql.gz on first boot. Runs once per
  # stack start against the healthy server and is idempotent — the seed only
  # enters a database that has no tables, so live data always wins.
  db-init:
    image: dhi.io/mariadb:12
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
    volumes:
      - ./docker/db/init.sh:/init.sh:ro
      - ./data/db.sql.gz:/seed/db.sql.gz:ro
    restart: "no"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  valkey:
    image: valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    logging: *default-logging
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

  # Caddy as a Docker Hardened Image, for the same reasons as the database and
  # with the same floating tag (Renovate cannot resolve dhi.io, so a digest
  # would freeze). The measured difference is not theoretical: caddy:2-alpine —
  # pinned to the current upstream digest, which has not been rebuilt since
  # 2026-06-22 — carries 26 fixable CVEs, ten of them CRITICAL or HIGH, in the
  # Go standard library the caddy binary is built from and in curl. The
  # hardened image reports none.
  #
  # It contains exactly one executable, /usr/local/bin/caddy: no shell, no
  # wget, so the previous admin-API healthcheck cannot run. `caddy reload` is
  # the probe the binary itself provides — it reaches the admin API and returns
  # "config is unchanged" in ~0.1s, so it reports liveness without mutating
  # anything in practice.
  caddy:
    image: dhi.io/caddy:2
    logging: *default-logging
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data-v2:/data
      - caddy-config-v2:/config
    environment:
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/caddy", "reload", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  # -v2 because the hardened image runs as a different uid than the official one
  # that created the previous volume; a rename gets every environment a fresh,
  # correctly owned data directory (re-seeded from data/db.sql.gz) instead of a
  # permission-denied crash loop. The demo database is disposable by design.
  typo3-db-v2:
  typo3-fileadmin:
  typo3-var:
  typo3-config:
  # Same reason as above: the old caddy volumes were created by a root-running
  # image and the hardened one cannot write them (verified: it exits 1 on
  # "mkdir /data/caddy/pki: permission denied"). Caddy issues a fresh
  # certificate into the new volume on first start.
  caddy-data-v2:
  caddy-config-v2:
