name: typo3-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ghcr.io/netresearch/typo3-demo:latest
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # service_started (not _healthy) so a slow or broken Solr spike never
      # blocks web boot — the entrypoint probes Solr tolerantly.
      solr:
        condition: service_started
    environment:
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
      TYPO3_ENCRYPTION_KEY: ${TYPO3_ENCRYPTION_KEY:-}
      TYPO3_INSTALL_TOOL_PASSWORD: ${TYPO3_INSTALL_TOOL_PASSWORD:-joh316}
    volumes:
      - typo3-fileadmin:/var/www/public/fileadmin
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"Host: $${TYPO3_DOMAIN:-localhost}\" http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  # Symfony Messenger consumer for nr-repurpose's async generation jobs
  # (doctrine transport). Reuses the web image; the web service has already
  # run the entrypoint setup by the time this starts. The consumer exits
  # after its time/memory limits and on fatal errors — the restart policy
  # recycles it either way, with Docker-visible backoff on crash loops.
  worker:
    image: ghcr.io/netresearch/typo3-demo:latest
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    # www-data so generated artifacts (podcasts, PNGs) on the shared
    # fileadmin/var volumes stay manageable by the web container's php-fpm.
    user: www-data
    entrypoint: ["sh", "-c"]
    command:
      - >
        exec vendor/bin/typo3 messenger:consume doctrine
        --time-limit=3600 --memory-limit=512M --sleep=2
    environment:
      # Writable HOME for chromium (www-data has no home dir in the image);
      # /tmp keeps browser cache litter off the persistent var volume.
      HOME: /tmp
      MARIADB_HOST: db
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
      TYPO3_CONTEXT: ${TYPO3_CONTEXT:-Development/Docker}
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
      TYPO3_SITE_BASE: ${TYPO3_SITE_BASE:-/}
    volumes:
      - typo3-fileadmin:/var/www/public/fileadmin
      - typo3-var:/var/www/var
      - typo3-config:/var/www/config/system
    # Override the web image's baked-in nginx HEALTHCHECK (the worker runs no
    # nginx) with a consumer-process check. `disable: true` is not enough:
    # `up --wait` errors on services with no healthcheck configured.
    healthcheck:
      # [m] bracket trick: keeps the healthcheck shell's own cmdline from
      # matching, which would report healthy even with a dead consumer.
      test: ["CMD-SHELL", "pgrep -f '[m]essenger:consume' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # Trimmed from 1G to make room for the always-on Solr spike within the
          # 4GB host budget (web 1G + worker 768M + db 512M + valkey 128M +
          # caddy 256M + solr 512M).
          memory: 768M

  # Apache Solr search server for EXT:solr (disposable spike). Internal only:
  # the web/worker containers reach it over the compose network at solr:8983.
  # Bounded on purpose for the 4GB host — 256M JVM heap under a 512M cgroup cap.
  solr:
    image: typo3solr/ext-solr:14.0.0-RC1
    logging: *default-logging
    environment:
      # Official Solr image heap var; sets both -Xms and -Xmx. 384m is the
      # practical floor for Solr 10 to start and stay healthy with a tiny demo
      # index; kept low for the 4GB host (see the memory limit below).
      SOLR_HEAP: "384m"
    volumes:
      # Named volume is seeded from the image's baked-in TYPO3 cores on first
      # creation, then persists the index across restarts. SOLR_HOME is
      # /var/solr/data; mounting the parent keeps cores + index together.
      - solr-data:/var/solr
    healthcheck:
      # Bundled script: verifies Solr responds and every baked-in core pings OK.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # 384m heap + JVM overhead (metaspace, threads, off-heap) fits under
          # 640M. Total committed: web 1G + worker 768M + db 512M + valkey 128M
          # + caddy 256M + solr 640M = 3.3G on the 4GB host.
          memory: 640M

  db:
    image: mariadb:11
    logging: *default-logging
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-typo3}
      MARIADB_USER: ${MARIADB_USER:-typo3}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-typo3}
    volumes:
      - typo3-db:/var/lib/mysql
      - ./data/db.sql.gz:/docker-entrypoint-initdb.d/db.sql.gz:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  valkey:
    image: valkey/valkey:8-alpine
    logging: *default-logging
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      TYPO3_DOMAIN: ${TYPO3_DOMAIN:-localhost}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  typo3-db:
  typo3-fileadmin:
  typo3-var:
  typo3-config:
  caddy-data:
  caddy-config:
  solr-data:
