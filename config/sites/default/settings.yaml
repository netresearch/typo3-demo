# nr-landingpage: show the AI notice on pages the Landing Page Generator wrote.
# Off by default in the extension; the demo exists to show the AI features.
nr_landingpage.aiLabel.enabled: true

# nr_browser_ai: hosts a form assistant plugin may send its query to when its
# data source is a JSON endpoint. Empty by default in the extension; the demo
# names the Open-Meteo air quality API that the form built in the backend uses.
plugin.tx_nrbrowserai_formassistant.settings.allowedDataSourceHosts: 'air-quality-api.open-meteo.com'

# nr-llm A2A server role: this site answers A2A 1.0 requests at
# /a2a and publishes its agent card at /a2a/.well-known/agent-card.json
# (docker/web/nginx.conf lets exactly that dot path through). nr-llm builds
# every URL of the card from this value, never from the request's Host header,
# and a request to another host is not an A2A request. TYPO3_DOMAIN is the
# domain Caddy serves the site under. The server role itself is switched on in
# the extension configuration (entrypoint, block nr_llm_a2a); the profiles and
# the client are seeded there too.
nrllm.a2a.baseUrl: 'https://%env(TYPO3_DOMAIN)%/a2a'
