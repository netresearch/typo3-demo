base: '%env(TYPO3_SITE_BASE)%'
languages:
  - title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
    # autotranslate: source language handed to DeepL for records in this language.
    deeplSourceLang: EN
  # German is a secondary language with a fallback to English (languageId 0):
  # pages and content elements without a German translation render their English
  # source under /de/ instead of returning a 404, so the language switcher works
  # across the whole demo, not only on the translated pages.
  - title: Deutsch
    enabled: true
    languageId: 1
    base: /de/
    locale: de_DE.UTF-8
    navigationTitle: Deutsch
    flag: de
    fallbackType: fallback
    fallbacks: '0'
    # autotranslate: without deeplTargetLang on the target language,
    # Translator::recordHasDeepLTranslationWork() returns false, the whole DeepL
    # block is skipped, and the localization still creates the target record as a
    # copy of the English source. That is the silent no-op behind NEXT-140.
    deeplTargetLang: DE
rootPageId: 1
websiteTitle: Netresearch TYPO3 Demo
# autotranslate, per table. The key names are generated by
# TranslationHelper::configurationFieldname() as lowerCamelCase of
# autotranslate_<table>_<setting>, which is why they read
# autotranslateTtContentEnabled and not autotranslate_tt_content_enabled.
# `*Languages` is a comma separated list of target language ids.
# `*Textfields` is a comma separated list of columns; a column only qualifies if
# its TCA type is input/text/flex, it declares no renderType and its eval does
# not contain "int" (TranslationHelper::translateableColumns()). The lists below
# were taken from the running instance's TCA, not guessed: target, cache_tags and
# author also qualify technically but are not editorial content, and pi_flexform
# is left out because translating a serialized plugin blob is not what anyone
# means by translating a page.
autotranslatePagesEnabled: 1
autotranslatePagesLanguages: '1'
autotranslatePagesTextfields: 'title,nav_title,subtitle,abstract,description,keywords,seo_title,og_title,og_description,twitter_title,twitter_description'
autotranslateTtContentEnabled: 1
autotranslateTtContentLanguages: '1'
autotranslateTtContentTextfields: 'header,subheader,bodytext'
dependencies:
  - netresearch/demo-site
