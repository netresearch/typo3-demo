# SonarCloud (automatic analysis) settings.
#
# The demo's database seed (data/*.sql) is declarative fixture data: each
# extension showcase page and dashboard card is an INSERT with near-identical
# HTML markup by design. Copy-paste detection on this fixture data is noise and
# is not deduplicable (it is data, not code), so exclude it from CPD only.
sonar.cpd.exclusions=data/*.sql
