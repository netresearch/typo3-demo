# Security headers (defense-in-depth, Caddy also sets these).
# Shared via include because add_header in a nested block drops all
# inherited add_header directives — every block that adds its own
# headers must re-include the full set.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
