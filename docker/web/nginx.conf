worker_processes auto;
pcre_jit on;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # No compression here — Caddy (edge proxy) handles zstd/brotli/gzip for clients
    #
    # No `keepalive` here on purpose, and `fastcgi_keep_conn` is off below. A
    # php-fpm child is bound to its FastCGI connection for as long as that
    # connection lives, so an nginx keepalive pool does not park idle sockets —
    # it parks WORKERS. With `keepalive 16` against `pm.max_children = 10` the
    # pool could pin every child, and further requests waited for one to come
    # free: measured 61 s on the demo host, at 0 % CPU and with an empty php-fpm
    # slowlog, because the scripts were never slow — they never got a worker.
    # Removing it took the slowest backend request from 61 s to 107 ms; an
    # intermediate `keepalive 8` still cost 19.6 s, so this is not a tuning
    # question. Connection setup to 127.0.0.1 is not worth a worker.
    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /var/www/public;
        index index.php index.html;
        client_max_body_size 50m;

        include /etc/nginx/security-headers.conf;

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # robots.txt and llms.txt are served here rather than from TYPO3.
        # public/ is generated at build time and carries not one file from the
        # repository, so a committed static file would need its own COPY and a
        # .gitignore exception; a TYPO3 page would need a record in the DB seed
        # for something that never changes. $host keeps both correct on every
        # domain the image is deployed under.
        location = /robots.txt {
            default_type text/plain;
            charset utf-8;
            charset_types text/plain;
            return 200 "User-agent: *\nDisallow: /typo3/\nDisallow: /_assets/\nAllow: /\n\nSitemap: https://$host/sitemap.xml\n";
        }

        # llms.txt: the emerging convention for telling an answer engine what a
        # site is and which pages carry the substance, in place of making it
        # infer that from navigation. Curated on purpose — a generated list of
        # every page would bury the demonstrations it exists to point at.
        location = /llms.txt {
            default_type text/plain;
            charset utf-8;
            charset_types text/plain;
            return 200 "# Netresearch TYPO3 Demo\n\n> A live TYPO3 v14 instance demonstrating the Netresearch extension suite. Every extension has its own page with a worked, runnable example rather than a feature list.\n\n## Extensions\n\n- [Browser AI form assistant](https://$host/extensions/browser-ai-form-assistant): fills a complex form from one sentence, on-device via Chrome's built-in AI — no API key and no server call. Demonstrates the chain intent -> structured output -> tool call -> real action.\n- [Extensions overview](https://$host/extensions): every demonstrated extension, each with its purpose and where to find it in the backend.\n\n## About\n\n- [Netresearch](https://www.netresearch.de/): the company behind the extensions.\n- Source: https://github.com/netresearch/typo3-demo\n";
        }

        location ~ \.php$ {
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_read_timeout 120;
            # See the upstream block: keeping the FastCGI connection open keeps a
            # php-fpm worker occupied with it.
            fastcgi_keep_conn off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            access_log off;
            try_files $uri =404;
        }

        # Block access to sensitive paths
        location ~ ^/(vendor|var|config|packages)/ { deny all; }
        location ~ \.(sql|sql\.gz|bak|orig|swp)$ { deny all; }
        location ~ /\. { deny all; }
    }
}
