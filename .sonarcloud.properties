# SonarCloud (automatic analysis) settings.
#
# The file name matters. Automatic analysis reads ONLY .sonarcloud.properties;
# it ignores sonar-project.properties, which is the file a CI-run scanner would
# read. This project — like every other repository in the organisation — uses
# automatic analysis, so the settings below had no effect while they lived in
# sonar-project.properties: the quality gate kept failing the duplication check
# on data/ (50% on PR #100, 91.5% on PR #102), and both had to be merged with a
# red gate. Renaming the file is the whole fix; the settings themselves are
# unchanged. If this project ever switches to a CI-run scanner, this file has to
# be renamed back.
#
# The demo's database seed (data/*.sql) is declarative fixture data, not source
# code: each extension showcase page and dashboard card is an INSERT with
# near-identical HTML markup by design. Sonar otherwise mis-parses this MySQL
# dump as PL/SQL (flagging newlines inside HTML string literals) and reports its
# repetitive fixture markup as duplication. Exclude it from analysis entirely;
# it is data, not deduplicable code.
sonar.exclusions=data/**
sonar.cpd.exclusions=data/**
