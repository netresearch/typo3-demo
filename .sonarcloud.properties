# SonarCloud (automatic analysis) settings.
#
# The file name matters. Automatic analysis reads ONLY .sonarcloud.properties;
# it ignores sonar-project.properties, which is the file a CI-run scanner would
# read. This project — like every other repository in the organisation — uses
# automatic analysis, so the settings below had no effect while they lived in
# sonar-project.properties: the quality gate kept failing the duplication check
# on data/ (50% on PR #100, 91.5% on PR #102), and both had to be merged with a
# red gate. Renaming the file is the whole fix; the settings themselves are
# unchanged. If this project ever switches to a CI-run scanner, this file has to
# be renamed back.
#
# The demo's database seed (data/*.sql) is declarative fixture data, not source
# code: each extension showcase page and dashboard card is an INSERT with
# near-identical HTML markup by design. Sonar otherwise mis-parses this MySQL
# dump as PL/SQL (flagging newlines inside HTML string literals) and reports its
# repetitive fixture markup as duplication. Exclude it from analysis entirely;
# it is data, not deduplicable code.
sonar.exclusions=data/**
sonar.cpd.exclusions=data/**

# Two rules conflict with deliberate supply-chain choices (NRS-4587, SBOM
# Phase 0). NOTE: automatic analysis does NOT read the multicriteria keys
# below from this file (verified on PR #113 — the issues kept coming back),
# so the same two ignores are ALSO set as a server-side project setting via
# `POST api/settings/set` (key sonar.issue.ignore.multicriteria). The entries
# here document the decision and take over if this project ever switches to a
# CI-run scanner (see the header above).
#
# docker:S8431 wants either a version tag or a digest, never both. Base images
# are pinned as tag@sha256 on purpose: the digest makes the reference
# reproducible, the tag keeps it human-readable, and Renovate's Docker manager
# updates exactly this tag@digest form automatically (a bare digest would rot).
#
# githubactions:S8546 wants a lock-file enforcing install in workflows. This
# repo commits no composer.lock by design (dev-main VCS deps are re-resolved
# each image build, see build.yml). The composer-audit job only resolves a
# throwaway lock via `composer update --no-install` — metadata only, nothing
# is downloaded, installed, or executed — and then audits it.
sonar.issue.ignore.multicriteria=dockerPin,composerLock
sonar.issue.ignore.multicriteria.dockerPin.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.dockerPin.resourceKey=docker/**/Dockerfile
sonar.issue.ignore.multicriteria.composerLock.ruleKey=githubactions:S8546
sonar.issue.ignore.multicriteria.composerLock.resourceKey=.github/workflows/security.yml
